bía y hacía mucha falta. Así fue que a los pocos meses parte de nuestra casa se convirtió en un paraíso de aritos, collares, carteras, anillos, cinturones, pines y, por supuesto, hebillitas. Me acuerdo perfecto de las dos primeras cajas que llegaron por encomienda desde Buenos Aires con cartelitos de las marcas Paw y Carey. Paw es o era una marca cuyo logo era una huellita de perro color negra y Carey tiene o tenía la particularidad de que todos sus productos eran de los colores del dulce de batata con chocolate, tipo marmolado. En esa época yo salía del colegio a las 12 del mediodía y entraba directo a trabajar al negocio. Aunque a esa hora estaba cerrado, me traía a todas las amigas del cole y las atendía a puertas cerradas. Por lo general ellas no tenían plata entonces compraban anotado y después sus xadres venían a pagar la deuda a fin de mes, si es que se acordaban.</div><div>Después mi abuela también necesitó un trabajo, entonces al negocio de accesorios -que no tenía nombre- se le adosó una mercería. Mi abuela era la modista del pueblo y muchas veces le costaba conseguir elementos como cierres, ganchitos, hilos, agujas, cintas, broderie, botones o alfileres para confeccionar sus creaciones. Entonces se armó una merecería para ella misma, pero también la compartía con otras clientas. Al principio los dos rubros, accesorios y mercería, estaban bien separados. Cada cosa tenía su vitrina exhibidora, su calculadora y su anotador. Pero con los movimientos del día a día, que es el tiempo y las emociones de todxs, muchas cosas se fueron corriendo de sus lugares y encontrando otras disposiciones y fusiones, como haciendo mini orgías: collar con lana, alfiler con arito con cinta, botón con pin. Este momento, este hallazgo en el estante de la memoria, se parece mucho a como son las hebillitas de Nikiri.&nbsp;</div><div>En El Probador y en el mundo las hebillas se diseminan como el laurel, son seres no tan sutiles que cumplen con su existencia.&nbsp;</div><div>¿Todo puede ser una hebilla?&nbsp;</div><div>Una estrella porno puede ser una hebilla</div><div><br></div><div>¿Una hebilla puede tener unx hijitx hebilla?</div><div>Sí, un lindo nombre para una hebilla bb es Andrea</div><div><br></div><div>¿Qué las hace lindas?</div><div>La luz, el aire, el brillo, la atmósfera, el mechoncito de pelo las hace lindas</div><div><br></div><div>¿Torpes o ingeniosas?</div><div>¿Se puede las 2?</div><div><br></div><div>¿Una certeza?</div><div>Hebilla se parece a semilla</div><div><br></div><div>¿Sostienen y exhiben al mismo tiempo?</div><div>Están más acá y más allá de lo útil pero nunca pierden del todo su condición de usables</div><div><br></div><div>¿Las hebillas son pedacitos de utopías?</div><div><br></div><div>Pedacitos de utopías inadvertidas que habitan nuestra cabeza, nuestro zapato, nuestra croc</div><div><br></div><div><br></div><div><br></div><div>୨୧(̷ ̷〇̷ ̷﹏̷ ̷〇̷ ̷)̷୨୧</div><div><br></div>"},{"id":"b-h4ag0q6","type":"grid","width":100,"mobileWidth":100,"align":"flow","cols":4,"mobileCols":2,"borderStyle":"none","borderWidth":1,"borderColor":"#111111","images":["https://lh3.googleusercontent.com/d/1kLaIx5a_2JVHCPVAw7GkZojaBilH5nw6","https://lh3.googleusercontent.com/d/1-pUbKa4iY-0VHeFJ71RPu5vBUD5K7F4L","https://lh3.googleusercontent.com/d/1fqbdJxhV9t6ZOf_gQqavlmsxnLZ-GWvf","https://lh3.googleusercontent.com/d/1ZucPTAtOswVajjyMQhXnOwv-gnKZvffw","https://lh3.googleusercontent.com/d/1T_ODXKg3cLKHaWshnp29Qi30LMDW-M14","https://lh3.googleusercontent.com/d/1VSrqKxc265oCFu-dCkUxteCvgG_cWL4P","https://lh3.googleusercontent.com/d/1Ekdn6dbc773g6LEDdGLdKgKDvwQU2lXD","https://lh3.googleusercontent.com/d/1MPC49xzn-hcPpq2z8quzKfbkb-pwOegQ"]}]},{"id":"ageneradas","name":"A.G.E.N.E.R.A.D.A.S.","featuredImg":"","blocks":[{"id":"b-0e502t4","type":"text","width":100,"mobileWidth":100,"align":"flow","borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","html":"<h2>Perfectos Dragones</h2><p>Escribí acá el texto...</p>"},{"id":"b-o42vinx","type":"g rGwnOlCQdieccaouO9eB3","https://lh3.googleusercontent.com/d/1Bze2IzzuSU46B6fGUdaadOemoMwQC4sd","https://lh3.googleusercontent.com/d/1iP4IGKBhrmQB40waAaQgsQiUPcU86snN","https://lh3.googleusercontent.com/d/1uG4p_-rwd-fOGxj6nPmcPnHO4CltoPec","https://lh3.googleusercontent.com/d/1ka79paf7nvQeuj-ufU0BrbScCoWnZSsB","https://lh3.googleusercontent.com/d/15PAspSQH_lmXDvolbu0Z37slxFtIoAx2","https://lh3.googleusercontent.com/d/1Xvox5RaoR4KIbBNL8kfs_4QTgvxX4Jke"]}]},{"id":"taller-bijouteria","name":"Taller Bijouteria. / Museo Malba","featuredImg":"https://lh3.googleusercontent.com/d/1gpWJyAgw_bBIOLyEbfV1l0NFJjjdDtBX","blocks":[{"id":"b-malba-1","type":"text","width":100,"mobileWidth":100,"align":"flow","borderStyle":"none","borderWidth":1,"borderColor":"#111111","html":"<h1>ଘ(˵╹-╹)━☆⋆ ˚｡⋆୨୧˚ taller bijoujería ˚୨୧⋆｡˚ ⋆ Museo MALBA.</h1><blockquote>Museo Malba, Arg, 2025.</blockquote><p>A cargo de Malicia Mirai y Nikiri Akerman&nbsp;</p><p>A partir de las imágenes generadas por la muestra <i>El desentierro del diablo</i> de Carrie Bencardino proponemos reflexionar sobre el mal a través de la creación de un talismán. Históricamente los hechizos han servido para repeler o atraer nuestras pasiones profundas, asimismo, ven sus facultades amplificadas dentro de un objeto o talismán. Para crear uno hemos dividido el taller en dos instancias, una primera parte imaginativa y textual, y una segunda manual y material que permitirá crear una pieza bijouterie para el cuello, llavero o cualquier otra parte del cuerpo. ¿Podremos protegernos del mal o lo usaremos a nuestro favor?</p><p>La actividad se dividió en dos instancias: una primera parte imaginativa y textual y una segunda manual y material que invitaba a crear una pieza bijouterie para el cuello, llavero o cualquier otra parte del cuerpo.</p><p><a href=\"https://malba.org.ar/evento/%E0%AC%98%CB%B5%E2%95%B9-%E2%95%B9%E2%94%81%E2%98%86%E2%8B%86-%CB%9A%EF%BD%A1%E2%8B%86%E0%AD%A8%E0%AD%A7%CB%9A-taller-bijoujeria-%CB%9A%E0%AD%A8%E0%AD%A7%E2%8B%86%EF%BD%A1%CB%9A-%E2%8B%86/\">malba.org.ar/bijoujeria</a></p>"},{"id":"b-malba-2","type":"image","width":34,"mobileWidth":100,"align":"center","borderStyle":"none","borderWidth":1,"borderColor":"#111111","x":289,"y":62,"src":"https://lh3.googleusercontent.com/d/1MYjnvjJCSzeS_5ytvqV1Ldgy2NUKMkN3","caption":""},{"id":"b-malba-grid","type":"grid","width":100,"mobileWidth":100,"align":"flow","cols":3,"mobileCols":2,"borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","images":["https://lh3.googleusercontent.com/d/1bAmFZcyiZlLUgJMmw9QISwviNGzgEEp0","https://lh3.googleusercontent.com/d/1ewmcIqnUG7gJx_GiJpyHg3K6VWxHVytQ","https://lh3.googleusercontent.com/d/10E5nrmbs09PVQvPm4JHNGG0wDvvc2Pb5","https://lh3.googleusercontent.com/d/1M6rdQ01YFs-BJTgCAgn81oCJi3NtVgwC","https://lh3.googleusercontent.com/d/1t3QFxOpKzTRQKUOpHNuQQFbUqgwn-xxh","https://lh3.googleusercontent.com/d/1c0j7l7rlbTmVrruc9JbnKLEwCBXdf6F4","https://lh3.googleusercontent.com/d/15gQDadLRLN8quEqHVc0apkOk1f5JSB53","https://lh3.googleusercontent.com/d/1SkRSiD-Yh2HuXMg2hNtJ6abxS_HEM3xc","https://lh3.googleusercontent.com/d/10lI_UNnMazxBYhWgRlj-aNj8mf8y9wXn","https://lh3.googleusercontent.com/d/1OAzP-AG3mBo_sc1KagqE-Z1EcL_VEx6Q","https://lh3.googleusercontent.com/d/1T2aXWIaQqHyWwkqtfbUgy76q3wmtGCYs","https://lh3.googleusercontent.com/d/1bAC43PxKf0A4xOHwKOTlH9HxEPQUJdxc","https://lh3.googleusercontent.com/d/1DUjJkh4TCg5qpxF_T8nv-73QszE7WFVw","https://lh3.googleusercontent.com/d/1MU4PMIPQz3rxg3vGw5btHTUFGNxPGSwQ","https://lh3.googleusercontent.com/d/1JEDITs7K9RnoK0PdoF6DYnRetX4lv4AP","https://lh3.googleusercontent.com/d/1RqUcpFeZLQU606Ju3pGap-xW5-LGb4XV","https://lh3.googleusercontent.com/d/1yjxLG-kMdpeftxYSwnd3fnn98c8RPC4q","https://lh3.googleusercontent.com/d/1pPjI-nvoEUUidakX6mRs3UurcKngSXBQ","https://lh3.googleusercontent.com/d/1KbR98isYvRZW_FpxtGF_Gecyso9Mz2b9","https://lh3.googleusercontent.com/d/1gpWJyAgw_bBIOLyEbfV1l0NFJjjdDtBX"]}]},{"id":"torre-mas-alta","name":"En La Torre Mas Alta. / Primor",     let activeSectionId = "home";

    let lbIndex = 0;
    let touchStartX = 0;

    const categoryListEl = document.getElementById("categoryList");
    const blocksContainerEl = document.getElementById("blocksContainer");
    const featuredImgEl = document.getElementById("featuredImg");
    const currentViewLabelEl = document.getElementById("currentViewLabel");
    const homeBtn = document.getElementById("homeBtn");
    const lightboxEl = document.getElementById("lightbox");
    const lightboxImgEl = document.getElementById("lightboxImg");
    const lightboxCaptionEl = document.getElementById("lightboxCaption");
    const lightboxCounterEl = document.getElementById("lightboxCounter");
    const lightboxPrevEl = document.getElementById("lightboxPrev");
    const lightboxNextEl = document.getElementById("lightboxNext");

    function getFallbackDriveUrl(url) {
      const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      return m ? "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1600" : url;
    }
    function openLb(imgs, idx, cap) {
      lbGallery = imgs;
      lbIndex = idx;
      updateLb(cap);
      lightboxEl.classList.add("open");
    }
    function updateLb(cap) {
      const src = lbGallery[lbIndex];
      lightboxImgEl.onerror = function() { this.onerror = null; this.src = getFallbackDriveUrl(src); };
      lightboxImgEl.src = src;
      lightboxCaptionEl.textContent = cap || "";
      if (lbGallery.length > 1) {
        lightboxPrevEl.style.display = "block";
        lightboxNextEl.style.display = "block";
        lightboxCounterEl.style.display = "block";
        lightboxCounterEl.textContent = (lbIndex + 1) + " / " + lbGallery.length;
      } else {
        lightboxPrevEl.style.display = "none";
        lightboxNextEl.style.display = "none";
        lightboxCounterEl.style.display = "none";
      }
    }
    function stepLb(d) {
      if (lbGallery.length <= 1) return;
      lbIndex = (lbIndex + d + lbGallery.length) % lbGallery.length;
      updateLb("");
    }
    lightboxPrevEl.addEventListener("click", e => { e.stopPropagation(); stepLb(-1); });
    lightboxNextEl.addEventListener("click", e => { e.stopPropagation(); stepLb(1); });
    lightboxEl.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    lightboxEl.addEventListener("touchend", e => {
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 40) stepLb(diff > 0 ? 1 : -1);
    }, { passive: true });

    function getSectionPreviewImage(sec) {
      if (sec.featuredImg) return sec.featuredImg;
      const imgB = sec.blocks.find(b => b.type === "image" && b.src);
      if (imgB) return imgB.src;
      const gridB = sec.blocks.find(b => b.type === "grid" && b.images && b.images.length);
      if (gridB) return gridB.images[0];
      const vidB = sec.blocks.find(b => b.type === "youtube" && b.videoId);
      if (vidB) return "https://img.youtube.com/vi/" + vidB.videoId + "/hqdefault.jpg";
      return DATA.home.featuredImg || "";
    }
    function setFeatured(src) {
      if (!src) return;
      featuredImgEl.onerror = function() { this.onerror = null; this.src = getFallbackDriveUrl(src); };
      featuredImgEl.src = src;
    }
    function applyBorder(el, b) {
      const st = b.borderStyle !== undefined ? b.borderStyle : "dashed";
      el.style.border = st === "none" ? "none" : (b.borderWidth || 1) + "px " + st + " " + (b.borderColor || "#111111");
      el.style.borderRadius = b.borderRadius || "0px";
    }
    function render() {
      categoryListEl.innerHTML = "";
      DATA.categories.forEach(cat => {
        const li = document.createElement("li");
        li.className = "category-item" + (activeSectionId === cat.id ? " active" : "");
        li.textContent = cat.name;
        li.addEventListener("mouseenter", () => setFeatured(getSectionPreviewImage(cat)));
        li.addEventListener("click", () => { activeSectionId = cat.id; render(); });
        categoryListEl.appendChild(li);
      });
      homeBtn.className = "site-title" + (activeSectionId === "home" ? " active" : "");
      const sec = activeSectionId === "home" ? DATA.home : DATA.categories.find(c => c.id === activeSectionId);
      if (!sec) return;
      currentViewLabelEl.textContent = sec.name;
      setFeatured(getSectionPreviewImage(sec));
      blocksContainerEl.innerHTML = "";
      sec.blocks.forEach(b => {
        const w = b.width || 100;
        const mw = b.mobileWidth !== undefined ? b.mobileWidth : 100;
        const align = b.align || "flow";
        const bEl = document.createElement("div");
        bEl.className = "block-item align-" + align + (b.hideMobile ? " mobile-hidden" : "");
        bEl.style.setProperty("--mob-w", mw + "%");
        bEl.style.setProperty("--mob-flow-w", mw >= 98 ? "100%" : "calc(" + mw + "% - 6px)");

        const bIn = document.createElement("div");
        bIn.className = "block-inner";
        if (align === "sticker") {
          bEl.style.width = w + "%";
          bEl.style.left = (b.x || 40) + "px";
          bEl.style.top = (b.y || 40) + "px";
        } else if (align === "flow") {
          bEl.style.width = w >= 98 ? "100%" : "calc(" + w + "% - 8px)";
        } else {
          bIn.style.width = w + "%";
        }
        if (b.type === "text") {
          const d = document.createElement("div");
          d.className = "text-block-content";
          d.innerHTML = b.html || "";
          applyBorder(d, b);
          bIn.appendChild(d);
        } else if (b.type === "spacer") {
          const sp = document.createElement("div");
          sp.className = "spacer-block-inner";
          sp.style.height = (b.height || 30) + "px";
          const ln = document.createElement("div");
          ln.className = "spacer-line";
          const st = b.borderStyle !== undefined ? b.borderStyle : "dashed";
          ln.style.borderTop = st === "none" ? "none" : (b.borderWidth || 1) + "px " + st + " " + (b.borderColor || "#111111");
          sp.appendChild(ln);
          bIn.appendChild(sp);
        } else if (b.type === "image") {
          const fig = document.createElement("div");
          fig.className = "image-block-figure";
          const img = document.createElement("img");
          img.src = b.src;
          img.loading = "lazy";
          applyBorder(img, b);
          img.onerror = function() { this.onerror = null; this.src = getFallbackDriveUrl(b.src); };
          img.addEventListener("click", () => openLb([b.src], 0, b.caption || ""));
          fig.appendChild(img);
          if (b.caption) {
            const c = document.createElement("div");
            c.className = "image-caption";
            c.textContent = b.caption;
            fig.appendChild(c);
          }
          bIn.appendChild(fig);
        } else if (b.type === "youtube") {
          const vw = document.createElement("div");
          vw.className = "video-block-wrapper";
          vw.style.aspectRatio = b.aspectRatio || "16 / 9";
          applyBorder(vw, b);
          const ifr = document.createElement("iframe");
          ifr.src = "https://www.youtube.com/embed/" + b.videoId;
          ifr.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
          ifr.allowFullscreen = true;
          vw.appendChild(ifr);
          bIn.appendChild(vw);
          if (b.caption) {
            const c = document.createElement("div");
            c.className = "image-caption";
            c.textContent = b.caption;
            bIn.appendChild(c);
          }
        } else if (b.type === "grid") {
          const gc = document.createElement("div");
          gc.className = "grid-block-masonry";
          gc.style.columnCount = b.cols || 3;
          gc.style.setProperty("--mob-cols", b.mobileCols || 2);
          (b.images || []).forEach((src, i) => {
            const sub = document.createElement("div");
            sub.className = "grid-sub-item";
            const img = document.createElement("img");
            img.src = src;
            img.loading = "lazy";
            applyBorder(img, b);
            img.onerror = function() { this.onerror = null; this.src = getFallbackDriveUrl(src); };
            img.addEventListener("click", () => openLb(b.images, i, ""));
            sub.appendChild(img);
            gc.appendChild(sub);
          });
          bIn.appendChild(gc);
        }
        bEl.appendChild(bIn);
        blocksContainerEl.appendChild(bEl);
      });
    }
    homeBtn.addEventListener("mouseenter", () => setFeatured(getSectionPreviewImage(DATA.home)));
    homeBtn.addEventListener("click", () => { activeSectionId = "home"; render(); });
    document.getElementById("lightboxClose").addEventListener("click", () => lightboxEl.classList.remove("open"));
    lightboxEl.addEventListener("click", e => { if (e.target === lightboxEl) lightboxEl.classList.remove("open"); });
    document.addEventListener("keydown", e => {
      if (!lightboxEl.classList.contains("open")) return;
      if (e.key === "Escape") lightboxEl.classList.remove("open");
      if (e.key === "ArrowLeft") stepLb(-1);
      if (e.key === "ArrowRight") stepLb(1);
    });
    render();
  </script>
</body>
</html>

erColor":"#111111","html":"<h1>Que tengas un hermoso dia..&nbsp;</h1><blockquote>Virtual, 2025</blockquote><div>colaboracion con marca de indumentaria koreana. <a href=\"sculptorworldwide.com\">sculptorworldwide.com</a></div><div><br></div><div>Campaña digital de moda editorial. La fantasía mezcla elementos más parecidos a un objeto artístico con prendas de moda y estilismos maximalistas. La combinación borronea los límites del objeto exhibido iluminando su naturaleza artística. El formato selfie remite al discurso de influencer en las redes sociales, el género bicho y la frescura de una intimidad aparente.&nbsp;</div><div><br></div>"},{"id":"b-xn8o7bk","type":"image","width":66,"mobileWidth":80,"align":"center","borderStyle":"none","borderWidth":1,"borderColor":"#111111","x":50,"y":50,"src":"https://lh3.googleusercontent.com/d/1biLWpywMc0w7kCN4nnknyGVInBS1JQh_","caption":""},{"id":"b-diwgvk1","type":"image","width":48,"mobileWidth":89,"align":"flow","borderStyle":"none","borderWidth":1,"borderColor":"#111111","x":50,"y":50,"src":"https://lh3.googleusercontent.com/d/1RSL96UMue1qV9kw2m5Iiis-cuRMWvZLp","caption":""},{"id":"b-y6l206k","type":"image","width":48,"mobileWidth":74,"align":"center","borderStyle":"none","borderWidth":1,"borderColor":"#111111","x":50,"y":50,"src":"https://lh3.googleusercontent.com/d/1m7qYS8AbbgllB9ONRiZU_4g8SH96g45a","caption":""},{"id":"b-gx5h1q0","type":"grid","width":100,"mobileWidth":100,"align":"center","cols":3,"mobileCols":2,"borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","images":["https://lh3.googleusercontent.com/d/1XKVnoydgRirG01xuyAwcWuMGFvO7Kk2g","https://lh3.googleusercontent.com/d/1UBbjKF7iYcqskjFPWsMRzP9BpzpjhM6d","https://lh3.googleusercontent.com/d/1opOAw_-gsiXf0UqiO0YTbtapOAZA5ff5","https://lh3.googleusercontent.com/d/1r2bwaI6-66ejkxNWfZdmQQrljuw3CPVR","https://lh3.googleusercontent.com/d/1AIJ6Aq3fEG4MLUxHTpN9FDZXWnl3jwx3","https://lh3.googleusercontent.com/d/1hvj8avwjDGofi6v9zozx7tuvXYzLrFX0","https://lh3.googleusercontent.com/d/13ltzHjO-MNWwSbc_skW8oWqfTkcDtEJ9","https://lh3.googleusercontent.com/d/1ViDlRXwTGEuaHVvg3tZ3CFT6ii4B5xUT","https://lh3.googleusercontent.com/d/1tiJ8ElwdCIKKYWq6_B0xr3zphKekvJtd","https://lh3.googleusercontent.com/d/1B-_HBRlm0aKA_M4unsv38VZaFMSckmyk","https://lh3.googleusercontent.com/d/1_LsKpf1Mm23PGb0SxEDkR-Jt2Oxfrbtl"]},{"id":"b-j6l4rg2","type":"spacer","width":100,"mobileWidth":100,"align":"flow","height":30,"borderStyle":"dotted","borderWidth":3,"borderColor":"#00ff55","hideMobile":false}]},{"id":"accesorios-princesa","name":"Accesorios de Princesa.","featuredImg":"https://lh3.googleusercontent.com/d/1hoj7L-J57TejIdwW2skK5DCgCdFf9j4P","blocks":[{"id":"b-isf5mf3","type":"text","width":100,"mobileWidth":100,"align":"flow","borderStyle":"none","borderWidth":1,"borderColor":"#111111","html":"<h1>Accesorios de Princesa.</h1><blockquote>Serie, 2025.</blockquote><p>Serie de objetos en madera y chapa que remiten a los accesorios que tendría una princesa. A su vez son objetos pensados para la defensa, una maxi cartera en MDF con calados cute una daga de aluminio que invoca a su familiar pegaso de chica mágica sublimada en una mariposa de chapa.</p>"},{"id":"b-8oagg8k","type":"image","width":48,"mobileWidth":100,"align":"center","borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","x":50,"y":50,"src":"https://lh3.googleusercontent.com/d/1hoj7L-J57TejIdwW2skK5DCgCdFf9j4P","caption":""},{"id":"b-w7hfk48","type":"image","width":48,"mobileWidth":100,"align":"center","borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","x":50,"y":50,"src":"https://lh3.googleusercontent.com/d/1xkiBuOCOadW0Ofev7Iu-vlg24bct_wsf","caption":""},{"id":"b-zchy01y","type":"image","width":32,"mobileWidth":100,"align":"center","borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","x":50,"y":50,"src":"https://lh3.googleusercontent.com/d/1Z16xJSIvkK4lHZK0qwUyFrIGl1QAqpCN","caption":""},{"id":"b-boir719","type":"image","width":48,"mobileWidth":100,"align":"flow","borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","x":50,"y":50,"src":"https://lh3.googleusercontent.com/d/1SJfW_JH_bx-6DargtefxTfElxqhuY2_e","caption":""},{"id":"b-jftrzo9","type":"image","width":32,"mobileWidth":100,"align":"flow","borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","x":50,"y":50,"src":"https://lh3.googleusercontent.com/d/186B1WjwBY5iBbbt8BjZsjINDbBKbyjBD","caption":""}]},{"id":"taller-bijouteria","name":"Taller Bijouteria. / Museo Malba","featuredImg":"https://lh3.googleusercontent.com/d/1gpWJyAgw_bBIOLyEbfV1l0NFJjjdDtBX","blocks":[{"id":"b-malba-1","type":"text","width":100,"mobileWidth":100,"align":"flow","borderStyle":"none","borderWidth":1,"borderColor":"#111111","html":"<h1>ଘ(˵╹-╹)━☆⋆ ˚｡⋆୨୧˚ taller bijoujería ˚୨୧⋆｡˚ ⋆ Museo MALBA.</h1><blockquote>Museo Malba, Arg, 2025.</blockquote><p>A cargo de Malicia Mirai y Nikiri Akerman&nbsp;</p><p>A partir de las imágenes generadas por la muestra <i>El desentierro del diablo</i> de Carrie Bencardino proponemos reflexionar sobre el mal a través de la creación de un talismán. Históricamente los hechizos han servido para repeler o atraer nuestras pasiones profundas, asimismo, ven sus facultades amplificadas dentro de un objeto o talismán. Para crear uno hemos dividido el taller en dos instancias, una primera parte imaginativa y textual, y una segunda manual y material que permitirá crear una pieza bijouterie para el cuello, llavero o cualquier otra parte del cuerpo. ¿Podremos protegernos del mal o lo usaremos a nuestro favor?</p><p>La actividad se dividió en dos instancias: una primera parte imaginativa y textual y una segunda manual y material que invitaba a crear una pieza bijouterie para el cuello, llavero o cualquier otra parte del cuerpo.</p><p><a href=\"https://malba.org.ar/evento/%E0%AC%98%CB%B5%E2%95%B9-%E2%95%B9%E2%94%81%E2%98%86%E2%8B%86-%CB%9A%EF%BD%A1%E2%8B%86%E0%AD%A8%E0%AD%A7%CB%9A-taller-bijoujeria-%CB%9A%E0%AD%A8%E0%AD%A7%E2%8B%86%EF%BD%A1%CB%9A-%E2%8B%86/\">malba.org.ar/bijoujeria</a></p>"},{"id":"b-malba-2","type":"image","width":34,"mobileWidth":100,"align":"center","borderStyle":"none","borderWidth":1,"borderColor":"#111111","x":289,"y":62,"src":"https://lh3.googleusercontent.com/d/1MYjnvjJCSzeS_5ytvqV1Ldgy2NUKMkN3","caption":""},{"id":"b-malba-grid","type":"grid","width":100,"mobileWidth":100,"align":"flow","cols":3,"mobileCols":2,"borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","images":["https://lh3.googleusercontent.com/d/1bAmFZcyiZlLUgJMmw9QISwviNGzgEEp0","https://lh3.googleusercontent.com/d/1ewmcIqnUG7gJx_GiJpyHg3K6VWxHVytQ","https://lh3.googleusercontent.com/d/10E5nrmbs09PVQvPm4JHNGG0wDvvc2Pb5","https://lh3.googleusercontent.com/d/1M6rdQ01YFs-BJTgCAgn81oCJi3NtVgwC","https://lh3.googleusercontent.com/d/1t3QFxOpKzTRQKUOpHNuQQFbUqgwn-xxh","https://lh3.googleusercontent.com/d/1c0j7l7rlbTmVrruc9JbnKLEwCBXdf6F4","https://lh3.googleusercontent.com/d/15gQDadLRLN8quEqHVc0apkOk1f5JSB53","https://lh3.googleusercontent.com/d/1SkRSiD-Yh2HuXMg2hNtJ6abxS_HEM3xc","https://lh3.googleusercontent.com/d/10lI_UNnMazxBYhWgRlj-aNj8mf8y9wXn","https://lh3.googleusercontent.com/d/1OAzP-AG3mBo_sc1KagqE-Z1EcL_VEx6Q","https://lh3.googleusercontent.com/d/1T2aXWIaQqHyWwkqtfbUgy76q3wmtGCYs","https://lh3.googleusercontent.com/d/1bAC43PxKf0A4xOHwKOTlH9HxEPQUJdxc","https://lh3.googleusercontent.com/d/1DUjJkh4TCg5qpxF_T8nv-73QszE7WFVw","https://lh3.googleusercontent.com/d/1MU4PMIPQz3rxg3vGw5btHTUFGNxPGSwQ","https://lh3.googleusercontent.com/d/1JEDITs7K9RnoK0PdoF6DYnRetX4lv4AP","https://lh3.googleusercontent.com/d/1RqUcpFeZLQU606Ju3pGap-xW5-LGb4XV","https://lh3.googleusercontent.com/d/1yjxLG-kMdpeftxYSwnd3fnn98c8RPC4q","https://lh3.googleusercontent.com/d/1pPjI-nvoEUUidakX6mRs3UurcKngSXBQ","https://lh3.googleusercontent.com/d/1KbR98isYvRZW_FpxtGF_Gecyso9Mz2b9","https://lh3.googleusercontent.com/d/1gpWJyAgw_bBIOLyEbfV1l0NFJjjdDtBX"]}]},{"id":"ageneradas","name":"A.G.E.N.E.R.A.D.A.S.","featuredImg":"","blocks":[{"id":"b-s5bmzv7","type":"text","width":100,"mobileWidth":100,"align":"flow","borderStyle":"dotted","borderWidth":1,"borderColor":"#000fe6","html":"<h1>A.G.E.N.E.R.A.D.A.S.</h1><p>Ageneradxs es un colectivo de arte cross con una preocupación particular por el límite entre el arte y la moda. La pieza de indumentaria como objeto trifásico, de exposición, de uso, y de performance, rompe los esquemas de la definición que operan sobre las tecnologías de género. De modo que permiten el tránsito hacia expresiones y experiencias diversas y dispares, confirmando así la posibilidad de un arte vivo, fluido y mutable.</p><p></p><ul><li><font color=\"#ff1493\"><u><b>“ Perfectos Dragones - Desfile Agenero ” La Lengua. Julio 2025</b></u></font></li><li><font color=\"#ff1493\"><u><b>“ Asado de Fashion - Feria 420 todo el Show” Las Deudas. Diciembre 2025</b></u></font></li><li><u><b><font color=\"#ff1493\">“ El límite entre el Arte y la Moda, show de Talentos”  Camion. Julio 2026&nbsp;</font></b></u></li><li><u><b><font color=\"#ff1493\">“Motivos?” Stand en Plateada Feria. Agosto 2026</font></b></u></li></ul><p></p><p><br></p>","borderRadius":"50%"},{"id":"b-sygfdwd","type":"image","width":20,"mobileWidth":43,"align":"left","borderStyle":"dotted","borderWidth":1,"borderColor":"#111111","x":50,"y":50,"src":"https://lh3.googleusercontent.com/d/1A0hevAJjty3WLUdFXtRfiDKyR8lc2uQt","caption":"","borderRadius":"0px","hideMobile":false},{"id":"b-0e502t4","type":"text","width":100,"mobileWidth":100,"align":"flow","borderStyle":"dotted","borderWidth":1,"borderColor":"#111111","html":"<h1>Perfectos Dragones</h1><blockquote>La Lengua, 2025</blockquote><p>Desfile de Tocadones realizado con objetos encontrados, ensambles sensibles al movimiento, piezas performáticas pesadas sobre modelos encontrados en el momento tergiversando su indumentaria hasta el final del desfile.&nbsp;&nbsp;</p><p><br></p>"},{"id":"b-o42vinx","type":"grid","width":100,"mobileWidth":100,"align":"flow","cols":3,"mobileCols":2,"borderStyle":"double","borderWidth":5,"borderColor":"#111111","images":["https://lh3.googleusercontent.com/d/1NUn0KvpcXF7nqBc8Yh31jTAYr6elQ1zo","https://lh3.googleusercontent.com/d/1m0ThR4lTMBtTZbNCJcHIXquHGniVQzBs","https://lh3.googleusercontent.com/d/1C9GR3QIYxyr7zcBCKrFKl-ZDxyraW0UW","https://lh3.googleusercontent.com/d/1gxKZqHVX-UR1c5_AQSHhDU2ffbajuYU_","https://lh3.googleusercontent.com/d/170oGSL5UUX8BScqBJUsnBY0xrfn0lE6J","https://lh3.googleusercontent.com/d/1AzlGpVBp9GkN7OkkB-z57KqaN3XABhwV"]},{"id":"b-qffqkcf","type":"text","width":100,"mobileWidth":100,"align":"flow","borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","html":"<h2>MOTIVOS?</h2><blockquote>Curaduria Yael Desbats. Feria La Plateada, 2026</blockquote><p>colección por docena de arte sin prejuicios para: motivos?&nbsp; premio al mejor fracaso 2030&nbsp;</p>"},{"id":"b-vaqsktq","type":"image","width":32,"mobileWidth":100,"align":"center","borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","x":50,"y":50,"src":"https://lh3.googleusercontent.com/d/1qwehcYfNSUgKC_dSzvC28rSFsPhA1YZ3","caption":""},{"id":"b-jbw8vev","type":"text","width":100,"mobileWidth":100,"align":"flow","borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","html":"<blockquote>Texto por Malicia Mirai</blockquote><p>Lo diferente no calza. En este aparente rompecabezas ninguna pieza se acomoda del todo a la morfología de la otra, aun compartiendo el<br>mismo motivo. Es evidente que para encontrar la diferencia debe existir en principio una similitud. La imagen contiene su propio corrimiento, aunque el significante como motivo no cambie, su significado está completamente expuesto a la variación. El motivo por ende es abstracto y fantasioso, aun si su naturaleza lo hace reconocible. En esa similitud con lo reconocible, que es plenamente material, es donde aflora la diferencia. Cada pieza se parece solo a sí<br>misma y para nada a lo que debería ser. Por ende, una tanga aunque se parezca a otra tanga y aparentemente sea una tanga, no está<br>sujeta necesariamente a ser esa misma prenda que indica, ni asignar género alguno al sujeto que la usa. Sin embargo, tampoco es<br>pertinente reducir su relación con el cuerpo a una cuestión de calce.</p><p><br>Cada pieza se confecciona bajo aproximaciones que luego se dan por hecho como normativa, aunque dentro de sus límites quepan la bombacha con bulto y el boxer sin costura. Asimismo, se exhiben siempre sobre una corporalidad hipotética que de por sí ya mitiga su valor de uso. Al exagerar este gesto, fusionando la obra al dispositivo de montaje, su respectiva percha, queda prácticamente anulada su capacidad de ser usada como prenda, exacerbando sus cualidades decorativas. Resulta curioso que aquello que decora y por tanto abulta, enmarca, y magnífica, a su vez, en otra acepción semiótica, esconde, recata, y erotiza, comprobando la multiplicidad semántica que brota más allá de la apariencia. Queda preguntarse si la prenda puede encaminarse a una moda inclusiva, o si solo puedereafirmarse en la exclusividad, en la singularidad propia de cada cuerpo.</p>"},{"id":"b-1re6v48","type":"grid","width":100,"mobileWidth":100,"align":"flow","cols":3,"mobileCols":2,"borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","images":["https://lh3.googleusercontent.com/d/1XxuxjDc-RXuxFNY-JrUrEVUSXyzjTGhp","https://lh3.googleusercontent.com/d/12N0T5rj0DKDnPzH1rk4lKeDiahL-jgRe","https://lh3.googleusercontent.com/d/17dMWq2y-rImGXE3HfhGY28p1MG3eIN_2","https://lh3.googleusercontent.com/d/1OnskecJsFv-g_oAg1JB6fBWnbv5qMw4O","https://lh3.googleusercontent.com/d/1WN8yR-UPE4py2RbjZUUQcpi_k5lr96uq","https://lh3.googleusercontent.com/d/1XVPehgdeEhinwZtWadkCtuEEr05iJ3Be","https://lh3.googleusercontent.com/d/1-fLKdjJ-4ElrnUcWm59mU5KWTO_bfH_f","https://lh3.googleusercontent.com/d/1MuGd_rF-MG3Gd1_ad_kRA75aGsEuRNbW","https://lh3.googleusercontent.com/d/1iVUmwx0jLzz3Rp4CvwwIub6yJapxOukt"]},{"id":"b-xcekvh7","type":"text","width":100,"mobileWidth":100,"align":"flow","borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","html":"<h2>El limite entre el arte y la moda</h2><p>Muestra agenerada sin prejuicio sucede gracias a la creciente preocupación por el límite entre el arte y la moda. En un contexto mal llamado hegemónico la obra aparece expuesta como un cadáver taxidermista, a su vez su falta aparente de utilidad sirvió de justificación para definir el arte desde la negatividad dialéctica. Sin embargo, ahí es donde la  ropa como objeto estético  rompe el binarismo que envenena la propulsión rizomanica. El objeto que es a la vez una prenda(no solo decorativa sino funcional) y una experiencia estética, la pieza performática que se permite aparecer en tanto moda. Es evidente la negación a cerrar un concepto, de modo que en un gesto agenerado, el género feria deviene muestra, evento, happening. Una coronación del espectro expresivo que es propio de la sensibilidad agenerada, un grupo de amigas sin género y sin prejuicio, que no serán muchas pero hacen lo que se les da la gana.</p><p><br></p><blockquote>Keratina, cornetas 🎉, piñatas, transpolitica, pelos largos, lupas de pelucas, audio curso de couching, punto de encuentro, convocatoria y premios a las personas perversas</blockquote><p><br></p><p><u><b>El escandalo se presenta en un nuevo concepto.</b></u></p><p><br></p><p><u><i><font color=\"#ff1493\">LA ULTIMA FRONTERA DONDE MUERE EL ARTE Y LA MODA</font></i></u></p><p>FERIA - MUESTRA - CONVERSATORIOS - CONVERSATORIOS - PROYECCIÓN - SECTOR DE ALMOHADAS - FASHION FILM EN VIVO - ESCENARIO TODO EL SHOW DE TALENTOS - CONVOCATORIA PERVER CON JURADO - STAND DE FOTOS - BATALLA DE DJ SET DE GLOBOS</p><p><br></p>"},{"id":"b-1fwcvtw","type":"image","width":48,"mobileWidth":100,"align":"center","borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","x":50,"y":50,"src":"https://lh3.googleusercontent.com/d/1ZTVHSKIfMG-R3hrIc3w5KhavvTy-YAlO","caption":""},{"id":"b-i6grvvg","type":"grid","width":100,"mobileWidth":100,"align":"flow","cols :""}]},{"id":"chicas-camiones","name":"Chicas, Camiones y Moñitos. / Para Vos Norma Mia","featuredImg":"https://lh3.googleusercontent.com/d/11WUvdBGPnngZvmJpe5UXhC9xnTFT0q-Z","blocks":[{"id":"b-wnr63c3","type":"text","width":100,"mobileWidth":100,"align":"flow","borderStyle":"none","borderWidth":1,"borderColor":"#111111","html":"<h1>Chicas, Camiones y Moñitos.&nbsp;</h1><blockquote>Para Vos Norma Mia, 2024</blockquote><p>Un diario de dibujos diarios en una resma de impresora. Fueron hechos con marcador del mismo grosor con una sola línea para no titubear en el trazo y no pensar demasiado la imagen. Además de en papel, las obras fueron dibujadas sobre cualquier tipo de soportes encontrados en la calle, cartones, maderas con formas curiosas y marcos infantiles. Como fueron muchos los dibujos de camiones, moñitos, y amigas, llenaron todo el pasillo de la galería generando una visión de túnel al momento de recorrer la muestra</p><p><br></p>"},{"id":"b-0iwkb6d","type":"grid","width":100,"mobileWidth":100,"align":"flow","cols":2,"mobileCols":2,"borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","images":["https://lh3.googleusercontent.com/d/116VwSVKMaRwlkJGM2NyyCZoV0LMgs4jt","https://lh3.googleusercontent.com/d/111IH_tYrZk2OFJYe0FND6c7Q_B-c4YOD","https://lh3.googleusercontent.com/d/118jQEQfLZzLXK3APdoESMkvwwhOuLEKs","https://lh3.googleusercontent.com/d/119wfVa96wjbrzxo0IWrL11Bp4joa5tAS","https://lh3.googleusercontent.com/d/11AzbtqMFu3g8mYV7zFi2FMNd9eFLEecb","https://lh3.googleusercontent.com/d/11CTsJOmVkABkt3SGPaMI_At3Ol5K7QWO","https://lh3.googleusercontent.com/d/11JMGueElmNsDOWJvXt26Snu6OOXSOlQd","https://lh3.googleusercontent.com/d/11VKiLVTvvaK01XJzvCSmsqe4jpRFXzD8","https://lh3.googleusercontent.com/d/11WUvdBGPnngZvmJpe5UXhC9xnTFT0q-Z","https://lh3.googleusercontent.com/d/11_TzvLgoerZ6wSuERXxRzUNc7ZDDZi_X","https://lh3.googleusercontent.com/d/11_hTjBE8c1lE-KtJQK1-epvy-hpckn4V"]},{"id":"b-ht7914p","type":"grid","width":100,"mobileWidth":100,"align":"center","cols":2,"mobileCols":2,"borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","images":["https://lh3.googleusercontent.com/d/13YNxZ196Z2K_GKEzjlG3woMuT6s_9PrS","https://lh3.googleusercontent.com/d/12qkuF3MntJphxxvmXXEQCWlRthtpS3X4","https://lh3.googleusercontent.com/d/13cF7uEdp-A6hP8vDxl3T-1PMPOg-WQe2","https://lh3.googleusercontent.com/d/145kxpEeyJfaU4hQNujJZPP3ILKFTlsYH","https://lh3.googleusercontent.com/d/14vS3Kzf7JcseLn4TXQcql9oOrhGftCNa","https://lh3.googleusercontent.com/d/15F8U-HhrEPxnqTY8qxgdy5YFzwXdx9J7","https://lh3.googleusercontent.com/d/15FknBZlRLFfX8YNwZFUFj79rXUU5fbCF","https://lh3.googleusercontent.com/d/15Wchhzld344hDBjUGZxIIgT2TPeOCHXS","https://lh3.googleusercontent.com/d/12elB8P_Kiw_8l3me5tin34-3AseccYPS"]}]},{"id":"hebillitas-nikiri","name":"Hebillitas Nikiri. / Galeria el Provador","featuredImg":"https://lh3.googleusercontent.com/d/1ZucPTAtOswVajjyMQhXnOwv-gnKZvffw","blocks":[{"id":"b-wcddw3z","type":"text","width":100,"mobileWidth":100,"align":"flow","borderStyle":"none","borderWidth":1,"borderColor":"#111111","html":"<h1>\"Hebillitas Nikiri\" Curaduria Vale Lopez Muñoz&nbsp;</h1><blockquote>Galeria el Provador, Las deudas. 2024</blockquote><div>Una carta de amor al miniaturismo. Las obras exhibidas en el Probador fueron composiciones de tela, mostacillas y accesorios de pelo que en su fusión se vuelven tanto pequeños cuadros portables y sensoriales, sus distintas texturas son agradables al tacto, como piezas de moda. De modo que son capaces de decorar pequeños rincones de la casa o grandes mechones de pelo, dependiendo del contexto.</div><div><br></div>"},{"id":"b-99fx9z4","type":"grid","width":100,"mobileWidth":100,"align":"flow","cols":4,"mobileCols":2,"borderStyle":"none","borderWidth":1,"borderColor":"#111111","images":["https://lh3.googleusercontent.com/d/1Ekdn6dbc773g6LEDdGLdKgKDvwQU2lXD"]},{"id":"b-i1mnzn0","type":"text","width":100,"mobileWidth":100,"align":"flow","borderStyle":"none","borderWidth":1,"borderColor":"#111111","html":"<blockquote>texto de sala x Vale Lopez Muñoz</blockquote><div>Las amigas se juntarán alrededor de ti&nbsp;</div><div>Como rodeando</div><div>Una hebilla para el pelo</div><div>(I ching)</div><div><br></div><div>Algunas veces hacemos cosas para sentirnos mejor. Una vez mi mamá necesitó cambiar de trabajo y se le ocurrió poner un negocio en el living de nuestra casa. Mi hermana y yo le suplicamos que porfi sea un negocio de accesorios de moda, porque en nuestro pueblo no había y hacía mucha falta. Así fue que a los pocos meses parte de nuestra casa se convirtió en un paraíso de aritos, collares, carteras, anillos, cinturones, pines y, por supuesto, hebillitas. Me acuerdo perfecto de las dos primeras cajas que llegaron por encomienda desde Buenos Aires con cartelitos de las marcas Paw y Carey. Paw es o era una marca cuyo logo era una huellita de perro color negra y Carey tiene o tenía la particularidad de que todos sus productos eran de los colores del dulce de batata con chocolate, tipo marmolado. En esa época yo salía del colegio a las 12 del mediodía y entraba directo a trabajar al negocio. Aunque a esa hora estaba cerrado, me traía a todas las amigas del cole y las atendía a puertas cerradas. Por lo general ellas no tenían plata entonces compraban anotado y después sus xadres venían a pagar la deuda a fin de mes, si es que se acordaban.</div><div>Después mi abuela también necesitó un trabajo, entonces al negocio de accesorios -que no tenía nombre- se le adosó una mercería. Mi abuela era la modista del pueblo y muchas veces le costaba conseguir elementos como cierres, ganchitos, hilos, agujas, cintas, broderie, botones o alfileres para confeccionar sus creaciones. Entonces se armó una merecería para ella misma, pero también la compartía con otras clientas. Al principio los dos rubros, accesorios y mercería, estaban bien separados. Cada cosa tenía su vitrina exhibidora, su calculadora y su anotador. Pero con los movimientos del día a día, que es el tiempo y las emociones de todxs, muchas cosas se fueron corriendo de sus lugares y encontrando otras disposiciones y fusiones, como haciendo mini orgías: collar con lana, alfiler con arito con cinta, botón con pin. Este momento, este hallazgo en el estante de la memoria, se parece mucho a como son las hebillitas de Nikiri.&nbsp;</div><div>En El Probador y en el mundo las hebillas se diseminan como el laurel, son seres no tan sutiles que cumplen con su existencia.&nbsp;</div><div>¿Todo puede ser una hebilla?&nbsp;</div><div>Una estrella porno puede ser una hebilla</div><div><br></div><div>¿Una hebilla puede tener unx hijitx hebilla?</div><div>Sí, un lindo nombre para una hebilla bb es Andrea</div><div><br></div><div>¿Qué las hace lindas?</div><div>La luz, el aire, el brillo, la atmósfera, el mechoncito de pelo las hace lindas</div><div><br></div><div>¿Torpes o ingeniosas?</div><div>¿Se puede las 2?</div><div><br></div><div>¿Una certeza?</div><div>Hebilla se parece a semilla</div><div><br></div><div>¿Sostienen y exhiben al mismo tiempo?</div><div>Están más acá y más allá de lo útil pero nunca pierden del todo su condición de usables</div><div><br></div><div>¿Las hebillas son pedacitos de utopías?</div><div><br></div><div>Pedacitos de utopías inadvertidas que habitan nuestra cabeza, nuestro zapato, nuestra croc</div><div><br></div><div><br></div><div><br></div><div>୨୧(̷ ̷〇̷ ̷﹏̷ ̷〇̷ ̷)̷୨୧</div><div><br></div>"},{"id":"b-h4ag0q6","type":"grid","width":100,"mobileWidth":100,"align":"flow","cols":4,"mobileCols":2,"borderStyle":"none","borderWidth":1,"borderColor":"#111111","images":["https://lh3.googleusercontent.com/d/1kLaIx5a_2JVHCPVAw7GkZojaBilH5nw6","https://lh3.googleusercontent.com/d/1-pUbKa4iY-0VHeFJ71RPu5vBUD5K7F4L","https://lh3.googleusercontent.com/d/1fqbdJxhV9t6ZOf_gQqavlmsxnLZ-GWvf","https://lh3.googleusercontent.com/d/1ZucPTAtOswVajjyMQhXnOwv-gnKZvffw","https://lh3.googleusercontent.com/d/1T_ODXKg3cLKHaWshnp29Qi30LMDW-M14","https://lh3.googleusercontent.com/d/1VSrqKxc265oCFu-dCkUxteCvgG_cWL4P","https://lh3.googleusercontent.com/d/1Ekdn6dbc773g6LEDdGLdKgKDvwQU2lXD","https://lh3.googleusercontent.com/d/1MPC49xzn-hcPpq2z8quzKfbkb-pwOegQ"]}]},{"id":"cli-cla-pium-miau","name":"CLI-CLA-PIUM-MIAU. / Gatita Gil","featuredImg":"https://lh3.googleusercontent.com/d/1jYV_Dh8OohedfiyoimIN6dWc3bAXT4AF","blocks":[{"id":"b-ltu1ovq","type":"text","width":100,"mobileWidth":100,"align":"flow","borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","html":"<h2>Kitten Hell</h2><p>Colectivo escénico plástico pluridisciplinario compuesto por Nazito, Jul Corazón, Azul Lara Suarez, Nikiri Akerman, Malicia Mirai, Andra, Yanpi. Combinando fuerzas generan piezas inmersivas de corta duración destinadas a ser experimentadas en su mutabilidad. Han intervenido espacios lúdicos como bares y teatros, organizado fiestas, festivales y desfiles así como estilismos e interiorismo en locales de ropa.&nbsp;</p>"},{"id":"b-f3dfxbk","type":"spacer","width":100,"mobileWidth":100,"align":"flow","height":30,"borderStyle":"dashed","borderWidth":1,"borderColor":"#111111"},{"id":"b-agobiln","type":"text","width":100,"mobileWidth":100,"align":"flow","borderStyle":"none","borderWidth":1,"borderColor":"#111111","html":"<h2>\"Cli-Cla-Pium-Miau\" - Festival de Arte Queer 2023 x Kitten Hell</h2><blockquote>Munar, Arg. 2023</blockquote><p>Uniendo fuerzas como colectivo de quienes nos conocimos en PAR, realizamos una instalación recorrible de 15 metros cúbicos con estatuas vivas, hongos flotantes, flores mutantes, cadáveres brillantes, popstars con posesión demoniaca y pistolas tecnológicas apuntando a la luz de las velas. Las gatitas plásticas te advierten que hay que estar armadas para el futuro, devenir un nuevo género digital, ya no más mostri sino bicho.</p>"},{"id":"b-34gyz4g","type":"grid","width":100,"mobileWidth":100,"align":"flow","cols":3,"mobileCols":2,"borderStyle":"double","borderWidth":3,"borderColor":"#111111","images":["https://lh3.googleusercontent.com/d/1jYV_Dh8OohedfiyoimIN6dWc3bAXT4AF","https://lh3.googleusercontent.com/d/1lcy2cwFzsAvrGwnOlCQdieccaouO9eB3","https://lh3.googleusercontent.com/d/1Bze2IzzuSU46B6fGUdaadOemoMwQC4sd","https://lh3.googleusercontent.com/d/1iP4IGKBhrmQB40waAaQgsQiUPcU86snN","https://lh3.googleusercontent.com/d/1uG4p_-rwd-fOGxj6nPmcPnHO4CltoPec","https://lh3.googleusercontent.com/d/1ka79paf7nvQeuj-ufU0BrbScCoWnZSsB","https://lh3.googleusercontent.com/d/15PAspSQH_lmXDvolbu0Z37slxFtIoAx2","https://lh3.googleusercontent.com/d/1Xvox5RaoR4KIbBNL8kfs_4QTgvxX4Jke"]}]},{"id":"torre-mas-alta","name":"En La Torre Mas Alta. / Primor","featuredImg":"","blocks":[{"id":"b-aqnwnlj","type":"text","width":100,"mobileWidth":100,"align":"flow","borderStyle":"none","borderWidth":1,"borderColor":"#111111","html":"<h1>\"en la torre mas alta\" curaduria Julien.</h1><blockquote><span style=\"font-style: italic; font-size: 13px;\">Primor es pop, Arg.2022</span></blockquote><p>Primer muestra individual.&nbsp;&nbsp;</p><p>Muestra instalativa hecha de cosas que tenía en mi pieza, asemejando la altura con unas nubes de confeti en las que se suceden experiencias performáticas. Gran parte de las obras son collages de stickers, mechones de pelo, dibujos de perros y ojos de plástico, todas tan amigables que te invitaban a levantarlas y cambiarlas de lugar, además no estaban limitadas por un marco, eran todas amigas.</p>"},{"id":"b-21f0lc7","type":"image","width":66,"mobileWidth":100,"align":"center","borderStyle":"double","borderWidth":1,"borderColor":"#ff00a2","x":50,"y":50,"src":"https://lh3.googleusercontent.com/d/1mJvsMuugXOsbuL4QuLj_fh93PQslT9sw","caption":""},{"id":"b-hbsvknf","type":"text","width":100,"mobileWidth":100,"align":"flow","borderStyle":"none","borderWidth":1,"borderColor":"#111111","html":"<i>texto curatorial x julien &lt;3<br></i><div><br></div><div>nikiri es una princesa preciosa</div><div>en la torre más alta se encuentra</div><div>para hacer esta bella muestra</div><div>baila, pinta, dibuja y posa&nbsp;</div><div><br></div><div>ella a ningún príncipe espera</div><div>acaso creías que estaba sola?</div><div>sus obras se transforman con un hola</div><div>son sus mejores amigas, re fiesteras</div><div><br></div><div>mirá arriba y abajo, tené cuidado</div><div>son pequeñas, frágiles y curiosas</div><div>se esconden en cualquier lado</div><div><br></div><div>dale animate son amistosas</div><div>sobre este piso plateado</div><div>ellas y vos se ven hermosas</div><div><br></div><div><br></div>"},{"id":"b-2vj2qel","type":"grid","width":100,"mobileWidth":100,"align":"flow","cols":4,"mobileCols":2,"borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","images":["https://lh3.googleusercontent.com/d/1tQgJ39YCWHswS9k3vhaYARD2Csc7cuwv","https://lh3.googleusercontent.com/d/1L5Qlpu1gl_fN2obdZ6Dtvrxvl5vACxJp","https://lh3.googleusercontent.com/d/1qLGDWK5HTXhVJpfDWC_oatzX3D5pFDX_","https://lh3.googleusercontent.com/d/1uifYfTcYUVXpJBjMgYyv6niyRUJ7syd0","https://lh3.googleusercontent.com/d/15oez6uXrN-dVe2HZ28k45UimtnDEa2Z4","https://lh3.googleusercontent.com/d/1JGlAWg9LEr0B_6fghxJ67P5Sdf9voj4m","https://lh3.googleusercontent.com/d/1457mqIO8lb4qyh7cJD4uXs6rDKv9Ypkl","https://lh3.googleusercontent.com/d/1kDMrDRveCQNTCKSW4cAZPEyNH4DAeQ0G","https://lh3.googleusercontent.com/d/1kqIBpRwnSLO78JcMxBb58QnFAIfV9ifx","https://lh3.googleusercontent.com/d/1HxetawLAWFCyYOEsw_kPGxS3Wk0V6deE","https://lh3.googleusercontent.com/d/1iotRYa7cQkWelsgRVhh-u9bk5a7qLavA","https://lh3.googleusercontent.com/d/1q_tMXnXph_83L9finsM8V-SPyKoXLAhh","https://lh3.googleusercontent.com/d/14dJfWtjh_tTSahD82LgUDc1irngACWmZ","https://lh3.googleusercontent.com/d/1IhKdn4YtHzGXdD1LLCKCu2tj6Nn8vqNC","https://lh3.googleusercontent.com/d/1GaA8RVy6BPrO4u6Aokv1Myd2smMSOOaR","https://lh3.googleusercontent.com/d/1aDDgDWBx2nhFCSOi1-yoO9XsxzoxDtbB"]},{"id":"b-bljlhm3","type":"image","width":100,"mobileWidth":100,"align":"flow","borderStyle":"dashed","borderWidth":1,"borderColor":"#111111","x":50,"y":50,"src":"https://lh3.googleusercontent.com/d/1libw5UZTlMCcDHqpPgJBA4Wv3nN5GeTf","caption":""}]}]};
    let activeSectionId = "home";
    let lbGallery = [];
    let lbIndex = 0;
    let touchStartX = 0;

    const categoryListEl = document.getElementById("categoryList");
    const blocksContainerEl = document.getElementById("blocksContainer");
    const featuredImgEl = document.getElementById("featuredImg");
    const currentViewLabelEl = document.getElementById("currentViewLabel");
    const homeBtn = document.getElementById("homeBtn");
    const lightboxEl = document.getElementById("lightbox");
    const lightboxImgEl = document.getElementById("lightboxImg");
    const lightboxCaptionEl = document.getElementById("lightboxCaption");
    const lightboxCounterEl = document.getElementById("lightboxCounter");
    const lightboxPrevEl = document.getElementById("lightboxPrev");
    const lightboxNextEl = document.getElementById("lightboxNext");

    function getFallbackDriveUrl(url) {
      const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      return m ? "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1600" : url;
    }
    function openLb(imgs, idx, cap) {
      lbGallery = imgs;
      lbIndex = idx;
      updateLb(cap);
      lightboxEl.classList.add("open");
    }
    function updateLb(cap) {
      const src = lbGallery[lbIndex];
      lightboxImgEl.onerror = function() { this.onerror = null; this.src = getFallbackDriveUrl(src); };
      lightboxImgEl.src = src;
      lightboxCaptionEl.textContent = cap || "";
      if (lbGallery.length > 1) {
        lightboxPrevEl.style.display = "block";
        lightboxNextEl.style.display = "block";
        lightboxCounterEl.style.display = "block";
        lightboxCounterEl.textContent = (lbIndex + 1) + " / " + lbGallery.length;
      } else {
        lightboxPrevEl.style.display = "none";
        lightboxNextEl.style.display = "none";
        lightboxCounterEl.style.display = "none";
      }
    }
    function stepLb(d) {
      if (lbGallery.length <= 1) return;
      lbIndex = (lbIndex + d + lbGallery.length) % lbGallery.length;
      updateLb("");
    }
    lightboxPrevEl.addEventListener("click", e => { e.stopPropagation(); stepLb(-1); });
    lightboxNextEl.addEventListener("click", e => { e.stopPropagation(); stepLb(1); });
    lightboxEl.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    lightboxEl.addEventListener("touchend", e => {
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 40) stepLb(diff > 0 ? 1 : -1);
    }, { passive: true });

    function getSectionPreviewImage(sec) {
      if (sec.featuredImg) return sec.featuredImg;
      const imgB = sec.blocks.find(b => b.type === "image" && b.src);
      if (imgB) return imgB.src;
      const gridB = sec.blocks.find(b => b.type === "grid" && b.images && b.images.length);
      if (gridB) return gridB.images[0];
      const vidB = sec.blocks.find(b => b.type === "youtube" && b.videoId);
      if (vidB) return "https://img.youtube.com/vi/" + vidB.videoId + "/hqdefault.jpg";
      return DATA.home.featuredImg || "";
    }
    function setFeatured(src) {
      if (!src) return;
      featuredImgEl.onerror = function() { this.onerror = null; this.src = getFallbackDriveUrl(src); };
      featuredImgEl.src = src;
    }
    function applyBorder(el, b) {
      const st = b.borderStyle !== undefined ? b.borderStyle : "dashed";
      el.style.border = st === "none" ? "none" : (b.borderWidth || 1) + "px " + st + " " + (b.borderColor || "#111111");
      el.style.borderRadius = b.borderRadius || "0px";
    }
    function render() {
      categoryListEl.innerHTML = "";
      DATA.categories.forEach(cat => {
        const li = document.createElement("li");
        li.className = "category-item" + (activeSectionId === cat.id ? " active" : "");
        li.textContent = cat.name;
        li.addEventListener("mouseenter", () => setFeatured(getSectionPreviewImage(cat)));
        li.addEventListener("click", () => { activeSectionId = cat.id; render(); });
        categoryListEl.appendChild(li);
      });
      homeBtn.className = "site-title" + (activeSectionId === "home" ? " active" : "");
      const sec = activeSectionId === "home" ? DATA.home : DATA.categories.find(c => c.id === activeSectionId);
      if (!sec) return;
      currentViewLabelEl.textContent = sec.name;
      setFeatured(getSectionPreviewImage(sec));
      blocksContainerEl.innerHTML = "";
      sec.blocks.forEach(b => {
        const w = b.width || 100;
        const mw = b.mobileWidth !== undefined ? b.mobileWidth : 100;
        const align = b.align || "flow";
        const bEl = document.createElement("div");
        bEl.className = "block-item align-" + align + (b.hideMobile ? " mobile-hidden" : "");
        bEl.style.setProperty("--mob-w", mw + "%");
        bEl.style.setProperty("--mob-flow-w", mw >= 98 ? "100%" : "calc(" + mw + "% - 6px)");

        const bIn = document.createElement("div");
        bIn.className = "block-inner";
        if (align === "sticker") {
          bEl.style.width = w + "%";
          bEl.style.left = (b.x || 40) + "px";
          bEl.style.top = (b.y || 40) + "px";
        } else if (align === "flow") {
          bEl.style.width = w >= 98 ? "100%" : "calc(" + w + "% - 8px)";
        } else {
          bIn.style.width = w + "%";
        }
        if (b.type === "text") {
          const d = document.createElement("div");
          d.className = "text-block-content";
          d.innerHTML = b.html || "";
          applyBorder(d, b);
          bIn.appendChild(d);
        } else if (b.type === "spacer") {
          const sp = document.createElement("div");
          sp.className = "spacer-block-inner";
          sp.style.height = (b.height || 30) + "px";
          const ln = document.createElement("div");
          ln.className = "spacer-line";
          const st = b.borderStyle !== undefined ? b.borderStyle : "dashed";
          ln.style.borderTop = st === "none" ? "none" : (b.borderWidth || 1) + "px " + st + " " + (b.borderColor || "#111111");
          sp.appendChild(ln);
          bIn.appendChild(sp);
        } else if (b.type === "image") {
          const fig = document.createElement("div");
          fig.className = "image-block-figure";
          const img = document.createElement("img");
          img.src = b.src;
          img.loading = "lazy";
          applyBorder(img, b);
          img.onerror = function() { this.onerror = null; this.src = getFallbackDriveUrl(b.src); };
          img.addEventListener("click", () => openLb([b.src], 0, b.caption || ""));
          fig.appendChild(img);
          if (b.caption) {
            const c = document.createElement("div");
            c.className = "image-caption";
            c.textContent = b.caption;
            fig.appendChild(c);
          }
          bIn.appendChild(fig);
        } else if (b.type === "youtube") {
          const vw = document.createElement("div");
          vw.className = "video-block-wrapper";
          vw.style.aspectRatio = b.aspectRatio || "16 / 9";
          applyBorder(vw, b);
          const ifr = document.createElement("iframe");
          ifr.src = "https://www.youtube.com/embed/" + b.videoId;
          ifr.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
          ifr.allowFullscreen = true;
          vw.appendChild(ifr);
          bIn.appendChild(vw);
          if (b.caption) {
            const c = document.createElement("div");
            c.className = "image-caption";
            c.textContent = b.caption;
            bIn.appendChild(c);
          }
        } else if (b.type === "grid") {
          const gc = document.createElement("div");
          gc.className = "grid-block-masonry";
          gc.style.columnCount = b.cols || 3;
          gc.style.setProperty("--mob-cols", b.mobileCols || 2);
          (b.images || []).forEach((src, i) => {
            const sub = document.createElement("div");
            sub.className = "grid-sub-item";
            const img = document.createElement("img");
            img.src = src;
            img.loading = "lazy";
            applyBorder(img, b);
            img.onerror = function() { this.onerror = null; this.src = getFallbackDriveUrl(src); };
            img.addEventListener("click", () => openLb(b.images, i, ""));
            sub.appendChild(img);
            gc.appendChild(sub);
          });
          bIn.appendChild(gc);
        }
        bEl.appendChild(bIn);
        blocksContainerEl.appendChild(bEl);
      });
    }
    homeBtn.addEventListener("mouseenter", () => setFeatured(getSectionPreviewImage(DATA.home)));
    homeBtn.addEventListener("click", () => { activeSectionId = "home"; render(); });
    document.getElementById("lightboxClose").addEventListener("click", () => lightboxEl.classList.remove("open"));
    lightboxEl.addEventListener("click", e => { if (e.target === lightboxEl) lightboxEl.classList.remove("open"); });
    document.addEventListener("keydown", e => {
      if (!lightboxEl.classList.contains("open")) return;
      if (e.key === "Escape") lightboxEl.classList.remove("open");
      if (e.key === "ArrowLeft") stepLb(-1);
      if (e.key === "ArrowRight") stepLb(1);
    });
    render();

    // --- MOTOR DE FÍSICAS PARA PLUMAS ---
    (function iniciarPlumas() {
      const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint, Query, Body, Events } = Matter;

      const canvas = document.getElementById("plumas-canvas");
      let width = window.innerWidth;
      let height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;

      const engine = Engine.create();
      engine.gravity.y = 0.04;

      const render = Render.create({
        canvas: canvas,
        engine: engine,
        options: {
          width: width,
          height: height,
          wireframes: false,
          background: "transparent"
        }
      });

      const urlsPlumas = [
        "./pluma1.png",
        "./pluma2.png"
      ];

      // Genera una versión con filtro hue-rotate para cada pluma
      function crearTexturaHue(src, hueDeg, callback) {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          const off = document.createElement("canvas");
          off.width = img.width || 100;
          off.height = img.height || 100;
          const ctx = off.getContext("2d");
          ctx.filter = "hue-rotate(" + hueDeg + "deg)";
          ctx.drawImage(img, 0, 0);
          callback(off.toDataURL());
        };
        img.onerror = () => callback(src);
        img.src = src;
      }

      const plumas = [];
      const cantidadPlumas = 12;
      const tamanoFijo = 38; // Tamaño uniforme pequeño en píxeles

      // Paredes invisibles en los 4 bordes de la pantalla
      const grosorPared = 100;
      let piso = Bodies.rectangle(width / 2, height + grosorPared / 2, width * 2, grosorPared, { isStatic: true, render: { visible: false } });
      let techo = Bodies.rectangle(width / 2, -600, width * 2, grosorPared, { isStatic: true, render: { visible: false } });
      let paredIzq = Bodies.rectangle(-grosorPared / 2, height / 2, grosorPared, height * 3, { isStatic: true, render: { visible: false } });
      let paredDer = Bodies.rectangle(width + grosorPared / 2, height / 2, grosorPared, height * 3, { isStatic: true, render: { visible: false } });

      Composite.add(engine.world, [piso, techo, paredIzq, paredDer]);

      for (let i = 0; i < cantidadPlumas; i++) {
        const url = urlsPlumas[i % urlsPlumas.length];
        const hueAleatorio = Math.floor(Math.random() * 360);

        crearTexturaHue(url, hueAleatorio, (dataUrl) => {
          const tempImg = new Image();
          tempImg.onload = () => {
            // Calcula la escala exacta para que todas midan lo mismo (tamanoFijo)
            const ladoMayor = Math.max(tempImg.width, tempImg.height) || 100;
            const escalaUniforme = tamanoFijo / ladoMayor;

            const x = Math.random() * (width - 80) + 40;
            const y = -Math.random() * 450 - 40;

            const pluma = Bodies.rectangle(x, y, tamanoFijo, tamanoFijo * 0.45, {
              restitution: 0.7,
              frictionAir: 0.035,
              density: 0.0005,
              angle: Math.random() * Math.PI,
              render: {
                sprite: {
                  texture: dataUrl,
                  xScale: escalaUniforme,
                  yScale: escalaUniforme
                }
              }
            });
            plumas.push(pluma);
            Composite.add(engine.world, pluma);
          };
          tempImg.src = dataUrl;
        });
      }

      // Movimiento de vaivén suave en el aire + rotación continua de hue
      Events.on(engine, "beforeUpdate", () => {
        const tiempo = engine.timing.timestamp * 0.001;
        plumas.forEach((p, idx) => {
          if (p.speed > 0.15) {
            const fuerzaViento = Math.sin(tiempo + idx) * 0.000015;
            Body.applyForce(p, p.position, { x: fuerzaViento, y: 0 });
          }
        });
      });

      // Ciclo suave de cambio de hue en el canvas completo para que sigan mutando de color mientras caen
      let hueCiclo = 0;
      setInterval(() => {
        hueCiclo = (hueCiclo + 2) % 360;
        canvas.style.filter = "hue-rotate(" + hueCiclo + "deg)";
      }, 80);

      const mouse = Mouse.create(canvas);
      const mouseConstraint = MouseConstraint.create(engine, {
        mouse: mouse,
        constraint: {
          stiffness: 0.15,
          render: { visible: false }
        }
      });
      Composite.add(engine.world, mouseConstraint);

      function actualizarInteraccion(clientX, clientY) {
        const punto = { x: clientX, y: clientY };
        const tocandoPluma = Query.point(plumas, punto).length > 0;
        if (tocandoPluma || mouseConstraint.body) {
          canvas.style.pointerEvents = "auto";
          canvas.style.cursor = mouseConstraint.body ? "grabbing" : "grab";
        } else {
          canvas.style.pointerEvents = "none";
          canvas.style.cursor = "default";
        }
      }

      window.addEventListener("mousemove", e => actualizarInteraccion(e.clientX, e.clientY));
      window.addEventListener("touchstart", e => {
        if (e.touches.length > 0) {
          const t = e.touches[0];
          actualizarInteraccion(t.clientX, t.clientY);
        }
      }, { passive: true });
      window.addEventListener("touchend", () => {
        setTimeout(() => { canvas.style.pointerEvents = "none"; }, 50);
      });

      window.addEventListener("resize", () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        render.options.width = width;
        render.options.height = height;

        Body.setPosition(piso, { x: width / 2, y: height + grosorPared / 2 });
        Body.setPosition(paredDer, { x: width + grosorPared / 2, y: height / 2 });
      });

      Render.run(render);
      const runner = Runner.create();
      Runner.run(runner, engine);
    })();
  </script>

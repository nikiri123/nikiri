<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nikiri akerman</title>
  <style id="dynamic-theme-style">
    :root {
      --bg-color: #ffffff;
      --text-color: #111111;
      --accent-color: #ff1493;
      --border-color: #111111;
      --font-main: Arial, Helvetica, sans-serif;
    }
  </style>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-main);
      font-size: 13px;
      line-height: 1.45;
    }

    .layout {
      display: flex;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* Primer tercio (1/3) */
    .sidebar {
      width: 33.3333%;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 20px;
      border-right: 1px dashed var(--border-color);
      background: var(--bg-color);
      z-index: 20;
    }

    

    /* Imagen destacada siempre horizontal */
    .featured-box {
      width: 100%;
      margin-bottom: 16px;
    }

    .featured-box img {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      display: block;
      border: 1px dashed var(--border-color);
      background: #f9f9f9;
    }

    .category-list {
      list-style: none;
    }

@keyframes flujoArcoiris {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .site-title {
      font-size: 14px;
      font-weight: normal;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 14px;
      padding: 2px 4px;
    }

    .category-item {
      cursor: pointer;
      padding: 2px 4px;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .site-title:hover,
    .category-item:hover {
      color: var(--accent-color);
    }

   
    .category-item.active {
      color: #111111;
      background: linear-gradient(
        90deg,
        #ff0000,
        #ff7f00,
        #ffff00,
        #00ff00,
        #00ffff,
        #0000ff,
        #ff00ff,
        #ff0000
      );
      background-size: 400% 100%;
      animation: flujoArcoiris 14s linear infinite;
    }

    .cat-edit-actions {
      display: none;
      gap: 2px;
      flex-shrink: 0;
    }

    .editor-active .cat-edit-actions {
      display: inline-flex;
    }

    .add-cat-box {
      display: none;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #cccccc;
      gap: 4px;
    }

    .editor-active .add-cat-box {
      display: flex;
    }

    .add-cat-box input {
      flex: 1;
      border: 1px dashed var(--border-color);
      padding: 3px 6px;
      font-size: 11px;
      font-family: inherit;
    }

    /* Dos tercios restantes (2/3) */
    .main {
      width: 66.6667%;
      padding: 20px;
      position: relative;
      min-height: 100vh;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border-color);
      gap: 10px;
      flex-wrap: wrap;
      position: relative;
      z-index: 15;
    }

    .toolbar-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      background: var(--bg-color);
      border: 1px dashed var(--border-color);
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text-color);
      font-family: inherit;
    }

    .btn:hover,
    .btn.active-btn {
      color: var(--accent-color);
      border-color: var(--accent-color);
    }

    /* Barra de herramientas de edición general */
    .editor-bar {
      display: none;
      margin-bottom: 16px;
      padding: 10px;
      border: 1px dashed var(--border-color);
      background: var(--bg-color);
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 15;
    }

    .editor-active .editor-bar {
      display: flex;
    }

    .quick-add-box {
      display: none;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px dashed var(--border-color);
      background: var(--bg-color);
      position: relative;
      z-index: 15;
    }

    .quick-add-box.open {
      display: block;
    }

    .quick-add-box textarea,
    .quick-add-box input[type="text"] {
      width: 100%;
      border: 1px dashed var(--border-color);
      padding: 6px;
      font-family: inherit;
      font-size: 12px;
      margin: 6px 0;
      resize: vertical;
    }

    /* Simulador de vista celular en el editor */
    .mobile-preview-wrapper {
      width: 100%;
      transition: all 0.2s ease;
    }

    .mobile-preview-mode .mobile-preview-wrapper {
      max-width: 390px;
      margin: 0 auto;
      border: 2px dashed var(--accent-color);
      padding: 14px;
      background: var(--bg-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .mobile-preview-banner {
      display: none;
      font-size: 11px;
      color: var(--accent-color);
      border-bottom: 1px dashed var(--accent-color);
      padding-bottom: 6px;
      margin-bottom: 12px;
      justify-content: space-between;
      align-items: center;
    }

    .mobile-preview-mode .mobile-preview-banner {
      display: flex;
    }

    /* Contenedor de Bloques */
    .blocks-container {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: flex-start;
      position: relative;
      min-height: 75vh;
    }

    .mobile-preview-mode .blocks-container {
      gap: 10px;
    }

    .block-item {
      position: relative;
      max-width: 100%;
    }

    .block-item.hidden-on-mobile {
      opacity: 0.42;
    }

    .align-left {
      flex-basis: 100%;
      display: flex;
      justify-content: flex-start;
    }

    .align-center {
      flex-basis: 100%;
      display: flex;
      justify-content: center;
    }

    .align-right {
      flex-basis: 100%;
      display: flex;
      justify-content: flex-end;
    }

    .block-inner {
      width: 100%;
      position: relative;
    }

    /* Modo Sticker Libre */
    .block-item.align-sticker {
      position: absolute;
      z-index: 10;
      margin: 0;
    }

    .block-item.align-sticker .image-block-figure img {
      cursor: grab;
    }

    .block-item.align-sticker .image-block-figure img:active {
      cursor: grabbing;
    }

    .editor-active .block-item.align-sticker .block-inner {
      border: 1px dashed var(--accent-color);
      background: rgba(255, 255, 255, 0.85);
      padding: 6px;
    }

    .editor-active .block-item:not(.align-sticker) .block-inner {
      border: 1px dashed #999999;
      padding: 8px;
    }

    .editor-active .block-item.dragging {
      opacity: 0.4;
    }

    /* Tirador libre de esquina */
    .free-resize-handle {
      display: none;
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 14px;
      height: 14px;
      background: var(--bg-color);
      border: 1px dashed var(--accent-color);
      color: var(--accent-color);
      font-size: 9px;
      line-height: 12px;
      text-align: center;
      cursor: nwse-resize;
      user-select: none;
      z-index: 12;
    }

    .editor-active .free-resize-handle {
      display: block;
    }

    /* Controles de cada bloque */
    .block-controls {
      display: none;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding-bottom: 6px;
      margin-bottom: 8px;
      border-bottom: 1px dashed #cccccc;
      font-size: 11px;
    }

    .editor-active .block-controls {
      display: flex;
    }

    .ctrl-group {
      display: flex;
      gap: 3px;
      align-items: center;
      flex-wrap: wrap;
    }

    .mini-btn {
      background: var(--bg-color);
      border: 1px dashed var(--border-color);
      padding: 2px 5px;
      font-size: 10px;
      cursor: pointer;
      color: var(--text-color);
      font-family: inherit;
    }

    .mini-btn:hover,
    .mini-btn.selected {
      color: var(--accent-color);
      border-color: var(--accent-color);
    }

    .drag-handle {
      cursor: grab;
      padding: 2px 5px;
      border: 1px dashed var(--border-color);
      user-select: none;
    }

    .width-slider {
      width: 60px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .width-label {
      font-size: 10px;
      min-width: 28px;
    }

    /* Bloque de Texto */
    .text-block-content {
      padding: 12px;
      line-height: 1.55;
      word-break: break-word;
    }

    .editor-active .text-block-content {
      min-height: 60px;
      outline: none;
    }

    .text-block-content h1 {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
      line-height: 1.25;
    }

    .text-block-content h2 {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .text-block-content h3 {
      font-size: 12px;
      font-weight: normal;
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }

    .text-block-content p {
      margin-bottom: 8px;
    }

    .text-block-content ul,
    .text-block-content ol {
      padding-left: 20px;
      margin-bottom: 8px;
    }

    .text-block-content blockquote {
      border-left: 1px dashed var(--border-color);
      padding-left: 10px;
      margin: 8px 0;
      font-style: italic;
    }

    .text-block-content a {
      color: var(--accent-color);
      text-decoration: underline;
    }

    /* Barra de formato enriquecido dentro de cada bloque de texto */
    .rich-toolbar {
      display: none;
      flex-wrap: wrap;
      gap: 3px;
      margin-bottom: 6px;
      padding: 4px;
      border: 1px dashed var(--border-color);
      background: #fafafa;
      align-items: center;
    }

    .editor-active .rich-toolbar {
      display: flex;
    }

    .rich-select {
      border: 1px dashed var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      font-size: 10px;
      padding: 1px 4px;
      cursor: pointer;
      font-family: inherit;
    }

    .color-wrap {
      display: inline-flex;
      align-items: center;
      border: 1px dashed var(--border-color);
      padding: 0 4px;
      font-size: 10px;
      gap: 3px;
      background: var(--bg-color);
    }

    .color-wrap input[type="color"] {
      width: 15px;
      height: 15px;
      border: none;
      padding: 0;
      background: none;
      cursor: pointer;
    }

    /* Bloque de Imagen Individual */
    .image-block-figure img {
      width: 100%;
      height: auto;
      display: block;
      cursor: zoom-in;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Bloque Separador / Espacio */
    .spacer-block-inner {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spacer-line {
      width: 100%;
      height: 0;
    }

    /* Bloque de Video YouTube */
    .video-block-wrapper {
      width: 100%;
      position: relative;
      background: #000000;
      overflow: hidden;
    }

    .video-block-wrapper iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
    }

    .image-caption {
      font-size: 11px;
      margin-top: 5px;
      color: var(--text-color);
      opacity: 0.85;
      line-height: 1.35;
    }

    .caption-input {
      display: none;
      width: 100%;
      margin-top: 6px;
      border: 1px dashed var(--border-color);
      padding: 4px 6px;
      font-size: 11px;
      font-family: inherit;
    }

    .editor-active .caption-input {
      display: block;
    }

    .editor-active .image-caption {
      display: none;
    }

    /* Bloque Grilla Múltiple (Masonry respetando perspectivas originales) */
    .grid-block-masonry {
      column-gap: 12px;
      width: 100%;
    }

    .grid-sub-item {
      break-inside: avoid;
      margin-bottom: 12px;
      position: relative;
    }

    .grid-sub-item img {
      width: 100%;
      height: auto;
      display: block;
      cursor: zoom-in;
      user-select: none;
    }

    .grid-sub-controls {
      display: none;
      position: absolute;
      top: 4px;
      right: 4px;
      gap: 2px;
      background: rgba(255, 255, 255, 0.92);
      padding: 2px;
      border: 1px dashed var(--border-color);
    }

    .editor-active .grid-sub-controls {
      display: flex;
    }

    .grid-add-more-bar {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #cccccc;
      gap: 4px;
    }

    .editor-active .grid-add-more-bar {
      display: flex;
    }

    .grid-add-more-bar input {
      flex: 1;
      border: 1px dashed var(--border-color);
      padding: 3px 6px;
      font-size: 11px;
      font-family: inherit;
    }

    /* Lightbox con flechas de galería */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.96);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
      user-select: none;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 82vw;
      max-height: 82vh;
      width: auto;
      height: auto;
      border: 1px dashed var(--border-color);
    }

    .lightbox-caption {
      margin-top: 10px;
      font-size: 12px;
      max-width: 80vw;
      text-align: center;
    }

    .lightbox-counter {
      position: fixed;
      top: 16px;
      left: 20px;
      background: var(--bg-color);
      border: 1px dashed var(--border-color);
      padding: 4px 8px;
      font-size: 12px;
      display: none;
    }

    .lightbox-close {
      position: fixed;
      top: 16px;
      right: 20px;
      background: var(--bg-color);
      border: 1px dashed var(--border-color);
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: var(--bg-color);
      border: 1px dashed var(--border-color);
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-color);
      z-index: 102;
      display: none;
    }

    .lightbox-prev {
      left: 16px;
    }

    .lightbox-next {
      right: 16px;
    }

    .lightbox-close:hover,
    .lightbox-nav:hover {
      color: var(--accent-color);
      border-color: var(--accent-color);
    }

    @media (max-width: 900px) {
      .layout {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        position: static;
        height: auto;
        border-right: none;
        border-bottom: 1px dashed var(--border-color);
      }
      .main {
        width: 100%;
      }
      .block-item.mobile-hidden-real {
        display: none !important;
      }
      .block-item:not(.align-sticker) {
        width: var(--mob-w, 100%) !important;
      }
      .block-inner {
        width: 100% !important;
      }
      .grid-block-masonry {
        column-count: var(--mob-cols, 2) !important;
      }
      .lightbox img {
        max-width: 92vw;
        max-height: 75vh;
      }
      .lightbox-nav {
        top: auto;
        bottom: 20px;
        transform: none;
        padding: 6px 14px;
      }
      .lightbox-prev {
        left: 25%;
      }
      .lightbox-next {
        right: 25%;
      }
    }
  </style>
</head>
<body>

  <div class="layout" id="appRoot">
    <!-- 1/3 Izquierda -->
    <aside class="sidebar">
      <div class="site-title active" id="homeBtn">nikiri akerman</div>

      <div class="featured-box">
        <img id="featuredImg" src="https://lh3.googleusercontent.com/d/19tRUdMH4rIgoPSqcTEWF5arrWYZpVMWs" alt="Vista previa">
      </div>

      <ul class="category-list" id="categoryList"></ul>

      <!-- Agregar nueva categoría en modo edición -->
      <div class="add-cat-box">
        <input type="text" id="newCatInput" placeholder="Nueva categoría...">
        <button class="mini-btn" id="addCatBtn">+ agregar</button>
      </div>
    </aside>

    <!-- 2/3 Derecha -->
    <main class="main">
      <div class="toolbar">
        <span id="currentViewLabel">inicio</span>
        <div class="toolbar-actions">
          <button class="btn active-btn" id="desktopDeviceBtn" title="Ver y editar en modo computadora">🖥️ compu</button>
          <button class="btn" id="mobileDeviceBtn" title="Previsualizar y editar diseño para celular">📱 celu</button>
          <button class="btn" id="toggleEditorBtn">+ editar bloques</button>
          <button class="btn" id="exportEditHtmlBtn">exportar editor</button>
          <button class="btn" id="exportPublicHtmlBtn">exportar web pública</button>
        </div>
      </div>

      <!-- Barra para agregar nuevos bloques y estilos globales -->
      <div class="editor-bar" id="editorBar">
        <div class="ctrl-group">
          <button class="btn" id="addTextBlockBtn">+ texto</button>
          <button class="btn" id="togglePhotoAddBtn">+ fotos (Drive)</button>
          <button class="btn" id="toggleVideoAddBtn">+ video (YouTube)</button>
          <button class="btn" id="addSpacerBlockBtn">+ separador</button>
          <button class="btn" id="toggleThemeBoxBtn">🎨 estilos web</button>
        </div>
        <div class="ctrl-group">
          <button class="btn" id="saveAllBtn">guardar cambios</button>
          <button class="btn" id="resetDataBtn">restaurar inicial</button>
        </div>
      </div>

      <!-- Caja desplegable de Estilos Globales de la Web -->
      <div class="quick-add-box" id="themeBox">
        <div class="ctrl-group" style="gap: 8px;">
          <span style="font-size: 11px; font-weight: bold;">Estilos generales del sitio:</span>
          <label class="color-wrap">Fondo <input type="color" id="themeBgInput" value="#ffffff"></label>
          <label class="color-wrap">Texto <input type="color" id="themeTextInput" value="#111111"></label>
          <label class="color-wrap">Acento <input type="color" id="themeAccentInput" value="#ff1493"></label>
          <label class="color-wrap">Bordes <input type="color" id="themeBorderInput" value="#111111"></label>
          <select id="themeFontSelect" class="rich-select">
            <option value="Arial, Helvetica, sans-serif">Arial / Helvética</option>
            <option value="'Courier New', Courier, monospace">Courier (Máquina)</option>
            <option value="'Times New Roman', Times, serif">Times New Roman</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="Verdana, Geneva, sans-serif">Verdana</option>
          </select>
          <button class="mini-btn" id="resetThemeBtn">colores originales</button>
        </div>
      </div>

      <!-- Caja desplegable para pegar links de Drive -->
      <div class="quick-add-box" id="quickAddBox">
        <label style="font-size: 11px;">Pegá uno o varios links de Google Drive:</label>
        <textarea id="driveLinksInput" rows="3" placeholder="https://drive.google.com/file/d/..."></textarea>
        <div class="ctrl-group">
          <span style="font-size: 11px;">Modo al pegar:</span>
          <select id="insertModeSelect" class="rich-select">
            <option value="auto" selected>Automático (si son varias, crea grilla)</option>
            <option value="grid">Siempre bloque grilla</option>
            <option value="single">Bloques sueltos (1 por foto)</option>
          </select>
          <span style="font-size: 11px; margin-left: 6px;">Cols compu / celu:</span>
          <select id="defaultGridCols" class="rich-select">
            <option value="2">2 cols</option>
            <option value="3" selected>3 cols</option>
            <option value="4">4 cols</option>
            <option value="5">5 cols</option>
          </select>
          <select id="defaultMobileGridCols" class="rich-select">
            <option value="1">1 col celu</option>
            <option value="2" selected>2 cols celu</option>
            <option value="3">3 cols celu</option>
          </select>
          <span style="font-size: 11px; margin-left: 6px;">Ancho (si es suelta):</span>
          <select id="defaultPhotoWidth" class="rich-select">
            <option value="25">Chica (25%)</option>
            <option value="32">Tercio (32%)</option>
            <option value="48" selected>Mediana (48%)</option>
            <option value="66">Grande (66%)</option>
            <option value="100">Completa (100%)</option>
          </select>
          <span style="font-size: 11px; margin-left: 6px;">Borde:</span>
          <select id="defaultPhotoBorder" class="rich-select">
            <option value="dashed" selected>Punteado (dashed)</option>
            <option value="none">Sin borde</option>
            <option value="solid">Continuo (solid)</option>
            <option value="dotted">Puntos (dotted)</option>
            <option value="double">Doble (double)</option>
          </select>
          <button class="btn" id="insertPhotosBtn">agregar fotos</button>
        </div>
      </div>

      <!-- Caja desplegable para pegar link de YouTube -->
      <div class="quick-add-box" id="quickVideoBox">
        <label style="font-size: 11px;">Pegá el link del video de YouTube (watch, youtu.be o shorts):</label>
        <input type="text" id="youtubeLinkInput" placeholder="https://www.youtube.com/watch?v=... o https://youtu.be/...">
        <div class="ctrl-group">
          <span style="font-size: 11px;">Formato:</span>
          <select id="defaultVideoRatio" class="rich-select">
            <option value="16 / 9" selected>Panorámico (16:9)</option>
            <option value="4 / 3">Clásico (4:3)</option>
            <option value="9 / 16">Vertical / Short (9:16)</option>
            <option value="1 / 1">Cuadrado (1:1)</option>
          </select>
          <span style="font-size: 11px; margin-left: 6px;">Ancho:</span>
          <select id="defaultVideoWidth" class="rich-select">
            <option value="32">Tercio (32%)</option>
            <option value="48">Mediano (48%)</option>

                              "html": "<blockquote>texto de sala x Vale Lopez Muñoz</blockquote><div>Las amigas se juntarán alrededor de ti&nbsp;</div><div>Como rodeando</div><div>Una hebilla para el pelo</div><div>(I ching)</div><div><br></div><div>Algunas veces hacemos cosas para sentirnos mejor. Una vez mi mamá necesitó cambiar de trabajo y se le ocurrió poner un negocio en el living de nuestra casa. Mi hermana y yo le suplicamos que porfi sea un negocio de accesorios de moda, porque en nuestro pueblo no había y hacía mucha falta. Así fue que a los pocos meses parte de nuestra casa se convirtió en un paraíso de aritos, collares, carteras, anillos, cinturones, pines y, por supuesto, hebillitas. Me acuerdo perfecto de las dos primeras cajas que llegaron por encomienda desde Buenos Aires con cartelitos de las marcas Paw y Carey. Paw es o era una marca cuyo logo era una huellita de perro color negra y Carey tiene o tenía la particularidad de que todos sus productos eran de los colores del dulce de batata con chocolate, tipo marmolado. En esa época yo salía del colegio a las 12 del mediodía y entraba directo a trabajar al negocio. Aunque a esa hora estaba cerrado, me traía a todas las amigas del cole y las atendía a puertas cerradas. Por lo general ellas no tenían plata entonces compraban anotado y después sus xadres venían a pagar la deuda a fin de mes, si es que se acordaban.</div><div>Después mi abuela también necesitó un trabajo, entonces al negocio de accesorios -que no tenía nombre- se le adosó una mercería. Mi abuela era la modista del pueblo y muchas veces le costaba conseguir elementos como cierres, ganchitos, hilos, agujas, cintas, broderie, botones o alfileres para confeccionar sus creaciones. Entonces se armó una merecería para ella misma, pero también la compartía con otras clientas. Al principio los dos rubros, accesorios y mercería, estaban bien separados. Cada cosa tenía su vitrina exhibidora, su calculadora y su anotador. Pero con los movimientos del día a día, que es el tiempo y las emociones de todxs, muchas cosas se fueron corriendo de sus lugares y encontrando otras disposiciones y fusiones, como haciendo mini orgías: collar con lana, alfiler con arito con cinta, botón con pin. Este momento, este hallazgo en el estante de la memoria, se parece mucho a como son las hebillitas de Nikiri.&nbsp;</div><div>En El Probador y en el mundo las hebillas se diseminan como el laurel, son seres no tan sutiles que cumplen con su existencia.&nbsp;</div><div>¿Todo puede ser una hebilla?&nbsp;</div><div>Una estrella porno puede ser una hebilla</div><div><br></div><div>¿Una hebilla puede tener unx hijitx hebilla?</div><div>Sí, un lindo nombre para una hebilla bb es Andrea</div><div><br></div><div>¿Qué las hace lindas?</div><div>La luz, el aire, el brillo, la atmósfera, el mechoncito de pelo las hace lindas</div><div><br></div><div>¿Torpes o ingeniosas?</div><div>¿Se puede las 2?</div><div><br></div><div>¿Una certeza?</div><div>Hebilla se parece a semilla</div><div><br></div><div>¿Sostienen y exhiben al mismo tiempo?</div><div>Están más acá y más allá de lo útil pero nunca pierden del todo su condición de usables</div><div><br></div><div>¿Las hebillas son pedacitos de utopías?</div><div><br></div><div>Pedacitos de utopías inadvertidas que habitan nuestra cabeza, nuestro zapato, nuestra croc</div><div><br></div><div><br></div><div><br></div><div>୨୧(̷ ̷〇̷ ̷﹏̷ ̷〇̷ ̷)̷୨୧</div><div><br></div>"

    function extractDriveUrls(rawText) {
      const urls = [];
      const regex = /(?:\/d\/|id=)([a-zA-Z0-9_-]{25,})/g;
      let match;
      while ((match = regex.exec(rawText)) !== null) {
        urls.push(`https://lh3.googleusercontent.com/d/${match[1]}`);
      }
      return urls;
    }

    function extractYoutubeId(url) {
      if (!url) return null;
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = url.match(regExp);
      return match ? match[1] : null;
    }

    function getFallbackDriveUrl(url) {
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (match) {
        return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1600`;
      }
      return url;
    }

    // Funciones de apertura y navegación del Lightbox
    function openLightbox(imagesArray, startIndex = 0, caption = "") {
      lightboxGallery = imagesArray;
      lightboxCurrentIndex = startIndex;
      updateLightboxDisplay(caption);
      lightboxEl.classList.add("open");
    }

    function updateLightboxDisplay(caption = "") {
      const currentSrc = lightboxGallery[lightboxCurrentIndex];
      lightboxImgEl.onerror = function() {
        this.onerror = null;
        this.src = getFallbackDriveUrl(currentSrc);
      };
      lightboxImgEl.src = currentSrc;
      lightboxCaptionEl.textContent = caption;

      if (lightboxGallery.length > 1) {
        lightboxPrevEl.style.display = "block";
        lightboxNextEl.style.display = "block";
        lightboxCounterEl.style.display = "block";
        lightboxCounterEl.textContent = `${lightboxCurrentIndex + 1} / ${lightboxGallery.length}`;
      } else {
        lightboxPrevEl.style.display = "none";
        lightboxNextEl.style.display = "none";
        lightboxCounterEl.style.display = "none";
      }
    }

    function stepLightbox(delta) {
      if (lightboxGallery.length <= 1) return;
      lightboxCurrentIndex = (lightboxCurrentIndex + delta + lightboxGallery.length) % lightboxGallery.length;
      updateLightboxDisplay("");
    }

    lightboxPrevEl.addEventListener("click", (e) => {
      e.stopPropagation();
      stepLightbox(-1);
    });

    lightboxNextEl.addEventListener("click", (e) => {
      e.stopPropagation();
      stepLightbox(1);
    });

    // Swipe táctil para celular en el lightbox
    lightboxEl.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    lightboxEl.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 40) {
        stepLightbox(diff > 0 ? 1 : -1);
      }
    }, { passive: true });

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(portfolioData));
    }

    function getCurrentSection() {
      if (activeSectionId === "home") return portfolioData.home;
      return portfolioData.categories.find(c => c.id === activeSectionId);
    }

    function getSectionPreviewImage(section) {
      if (section.featuredImg) return section.featuredImg;
      const firstImgBlock = section.blocks.find(b => b.type === "image" && b.src);
      if (firstImgBlock) return firstImgBlock.src;
      const firstGridBlock = section.blocks.find(b => b.type === "grid" && b.images && b.images.length > 0);
      if (firstGridBlock) return firstGridBlock.images[0];
      const firstVideoBlock = section.blocks.find(b => b.type === "youtube" && b.videoId);
      if (firstVideoBlock) return `https://img.youtube.com/vi/${firstVideoBlock.videoId}/hqdefault.jpg`;
      return portfolioData.home.featuredImg || "";
    }

    function setFeaturedImage(src) {
      if (!src) return;
      featuredImgEl.onerror = function() {

        this.src = getFallbackDriveUrl(src);

      featuredImgEl.src = src;
    }

    function getActiveWidth(block) {
      if (previewDevice === "mobile") {
        return block.mobileWidth !== undefined ? block.mobileWidth : 100;
      }
      return block.width || 100;
    }

    function applyBlockGeometry(blockEl, blockInner, block) {
      const w = getActiveWidth(block);
      const align = previewDevice === "mobile" && block.align === "sticker" ? "center" : (block.align || "flow");

      blockEl.className = `block-item align-${align}` + (block.hideMobile ? " hidden-on-mobile" : "");
      blockEl.style.left = "";
      blockEl.style.top = "";
      blockEl.style.width = "";
      blockInner.style.width = "";

      if (previewDevice === "mobile") {
        if (block.hideMobile && !editorOpen) {
          blockEl.style.display = "none";
          return;
        } else {
          blockEl.style.display = "";
        }
        if (align === "flow") {
          blockEl.style.width = w >= 98 ? "100%" : `calc(${w}% - 6px)`;
        } else {
          blockInner.style.width = w + "%";
        }
        return;
      }

      blockEl.style.display = "";
      if (align === "sticker") {
        blockEl.style.width = w + "%";
        blockEl.style.left = (block.x || 40) + "px";
        blockEl.style.top = (block.y || 40) + "px";
      } else if (align === "flow") {
        blockEl.style.width = w >= 98 ? "100%" : `calc(${w}% - 8px)`;
      } else {
        blockInner.style.width = w + "%";
      }
    }

    function applyElementBorder(el, block) {
      const style = block.borderStyle !== undefined ? block.borderStyle : "dashed";
      const width = block.borderWidth || 1;
      const color = block.borderColor || "#111111";
      const radius = block.borderRadius || "0px";

      if (style === "none") {
        el.style.border = "none";
      } else {
        el.style.border = `${width}px ${style} ${color}`;
      }
      el.style.borderRadius = radius;
    }

    function appendBorderControls(container, block, onUpdateCallback) {
      const borderSelect = document.createElement("select");
      borderSelect.className = "rich-select";
      borderSelect.title = "Estilo de borde";
      [
        { label: "borde: dashed", val: "dashed" },

        { label: "borde: sólido", val: "solid" },

      ].forEach(bOpt => {
        const o = document.createElement("option");
        o.value = bOpt.val;
        o.textContent = bOpt.label;
        if ((block.borderStyle !== undefined ? block.borderStyle : "dashed") === bOpt.val) o.selected = true;

      });

        block.borderStyle = borderSelect.value;
        onUpdateCallback();
        saveToStorage();
      });

      const thickSelect = document.createElement("select");

      [1, 2, 3, 5].forEach(px => {

        o.textContent = px + "px";
        if ((block.borderWidth || 1) === px) o.selected = true;
        thickSelect.appendChild(o);
      });
      thickSelect.addEventListener("change", () => {
        block.borderWidth = parseInt(thickSelect.value, 10);
        onUpdateCallback();
        saveToStorage();
      });
      container.appendChild(thickSelect);

      const radiusSelect = document.createElement("select");
      radiusSelect.className = "rich-select";
      radiusSelect.title = "Esquinas redondeadas";
      [
        { label: "recto", val: "0px" },
        { label: "suave 8px", val: "8px" },
        { label: "redondo 20px", val: "20px" },
        { label: "óvalo 50%", val: "50%" }
      ].forEach(rOpt => {
        const o = document.createElement("option");
        o.value = rOpt.val;
        o.textContent = rOpt.label;
        if ((block.borderRadius || "0px") === rOpt.val) o.selected = true;
        radiusSelect.appendChild(o);
      });
      radiusSelect.addEventListener("change", () => {
        block.borderRadius = radiusSelect.value;
        onUpdateCallback();
        saveToStorage();
      });

      bColorInput.value = block.borderColor || "#111111";
      bColorInput.addEventListener("input", () => {
        block.borderColor = bColorInput.value;
        onUpdateCallback();
      });
      bColorInput.addEventListener("change", () => {

      });
      bColorWrap.appendChild(bColorInput);

    function renderBlocks() {
      blocksContainerEl.innerHTML = "";
      const section = getCurrentSection();
      if (!section) return;

      setFeaturedImage(getSectionPreviewImage(section));

      section.blocks.forEach((block, index) => {
        if (!block.width) block.width = block.type === "image" ? 48 : 100;
        if (block.mobileWidth === undefined) block.mobileWidth = 100;
        if (!block.align) block.align = "flow";
        if (block.borderStyle === undefined) block.borderStyle = "dashed";
        if (!block.borderWidth) block.borderWidth = 1;
        if (!block.borderColor) block.borderColor = "#111111";

        const blockEl = document.createElement("div");
        const blockInner = document.createElement("div");
        blockInner.className = "block-inner";

        applyBlockGeometry(blockEl, blockInner, block);

        blockEl.draggable = editorOpen && block.align !== "sticker";

        blockEl.addEventListener("dragstart", (e) => {
          if (!editorOpen || block.align === "sticker") return;
          draggedIndex = index;
          blockEl.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
        });

        blockEl.addEventListener("dragend", () => {
          blockEl.classList.remove("dragging");
          draggedIndex = null;
        });

        blockEl.addEventListener("dragover", (e) => {
          if (!editorOpen || draggedIndex === null || block.align === "sticker") return;
          e.preventDefault();
        });

        blockEl.addEventListener("drop", (e) => {
          if (!editorOpen || draggedIndex === null || draggedIndex === index || block.align === "sticker") return;
          e.preventDefault();
          const moved = section.blocks.splice(draggedIndex, 1)[0];
          section.blocks.splice(index, 0, moved);
          saveToStorage();
          renderBlocks();
        });

        function enableStickerDrag(handleElement) {
          handleElement.addEventListener("pointerdown", (e) => {
            if (block.align !== "sticker" || previewDevice === "mobile") return;
            if (e.target.closest("button") || e.target.closest("input") || e.target.closest("select") || e.target.closest("iframe") || e.target.classList.contains("free-resize-handle")) return;
            e.preventDefault();

            const startX = e.clientX;
            const startY = e.clientY;
            const origX = block.x || 40;
            const origY = block.y || 40;

            function onMove(ev) {
              const dx = ev.clientX - startX;
              const dy = ev.clientY - startY;
              block.x = Math.max(0, Math.round(origX + dx));
              block.y = Math.max(0, Math.round(origY + dy));
              blockEl.style.left = block.x + "px";
              blockEl.style.top = block.y + "px";
            }

            function onUp() {
              window.removeEventListener("pointermove", onMove);
              window.removeEventListener("pointerup", onUp);
              saveToStorage();
            }

            window.addEventListener("pointermove", onMove);
            window.addEventListener("pointerup", onUp);
          });
        }

        // Controles superiores del bloque
        const controls = document.createElement("div");
        controls.className = "block-controls";

        const leftCtrl = document.createElement("div");
        leftCtrl.className = "ctrl-group";

        const dragHandle = document.createElement("span");
        dragHandle.className = "drag-handle";
        dragHandle.textContent = block.align === "sticker" ? "✥ mover" : "⋮⋮";
        dragHandle.title = block.align === "sticker" ? "Arrastrar libremente" : "Arrastrar para reordenar";
        leftCtrl.appendChild(dragHandle);

        if (block.align !== "sticker") {
          const upBtn = document.createElement("button");
          upBtn.className = "mini-btn";
          upBtn.textContent = "↑";
          upBtn.disabled = index === 0;
          upBtn.addEventListener("click", () => {
            if (index > 0) {
              const temp = section.blocks[index - 1];
              section.blocks[index - 1] = section.blocks[index];
              section.blocks[index] = temp;
              saveToStorage();
              renderBlocks();
            }
          });
          leftCtrl.appendChild(upBtn);

          const downBtn = document.createElement("button");
          downBtn.className = "mini-btn";
          downBtn.textContent = "↓";
          downBtn.disabled = index === section.blocks.length - 1;
          downBtn.addEventListener("click", () => {
            if (index < section.blocks.length - 1) {
              const temp = section.blocks[index + 1];
              section.blocks[index + 1] = section.blocks[index];
              section.blocks[index] = temp;
              saveToStorage();
              renderBlocks();
            }
          });
          leftCtrl.appendChild(downBtn);
        }

        // Posiciones
        [
          { label: "grilla", val: "flow" },
          { label: "izq", val: "left" },
          { label: "centro", val: "center" },
          { label: "der", val: "right" },
          { label: "sticker", val: "sticker" }
        ].forEach(al => {
          const alBtn = document.createElement("button");
          alBtn.className = "mini-btn" + (block.align === al.val ? " selected" : "");
          alBtn.textContent = al.label;
          alBtn.addEventListener("click", () => {
            block.align = al.val;
            if (al.val === "sticker" && (block.x === undefined || block.y === undefined)) {
              block.x = 60;
              block.y = 60;
            }
            saveToStorage();
            renderBlocks();
          });
          leftCtrl.appendChild(alBtn);
        });

        // Botón específico para ocultar en celular
        const hideMobBtn = document.createElement("button");
        hideMobBtn.className = "mini-btn" + (block.hideMobile ? " selected" : "");
        hideMobBtn.textContent = block.hideMobile ? "oculto en celu" : "ver en celu";
        hideMobBtn.title = "Mostrar u ocultar este bloque cuando se abre desde el celular";
        hideMobBtn.addEventListener("click", () => {
          block.hideMobile = !block.hideMobile;
          saveToStorage();
          renderBlocks();
        });
        leftCtrl.appendChild(hideMobBtn);

        // Controles derechos (sensibles al modo compu vs celu)
        const rightCtrl = document.createElement("div");
        rightCtrl.className = "ctrl-group";

        const currentW = getActiveWidth(block);

            renderBlocks();

          delBtn.className = "mini-btn";
          delBtn.textContent = "x";
          delBtn.title = "Eliminar bloque";
          delBtn.addEventListener("click", () => {
            section.blocks.splice(index, 1);
            saveToStorage();
            renderBlocks();

          controls.appendChild(leftCtrl);
          controls.appendChild(rightCtrl);
          blockInner.appendChild(controls);

        } else if (block.type === "spacer") {

            hSelect.appendChild(o);

          hSelect.addEventListener("change", () => {
            block.height = parseInt(hSelect.value, 10);
            spacerWrap.style.height = block.height + "px";

          appendBorderControls(rightCtrl, block, () => {
            const s = block.borderStyle !== undefined ? block.borderStyle : "dashed";

          controls.appendChild(rightCtrl);

          delBtn.className = "mini-btn";
          delBtn.textContent = "x";
          delBtn.title = "Eliminar bloque";
          delBtn.addEventListener("click", () => {
            section.blocks.splice(index, 1);
            saveToStorage();
            renderBlocks();
          });
          rightCtrl.appendChild(delBtn);

          controls.appendChild(leftCtrl);
          controls.appendChild(rightCtrl);
          blockInner.appendChild(controls);

          img.onerror = function() {

            cap.className = "image-caption";

          }

          const capInput = document.createElement("input");
          capInput.type = "text";
          capInput.className = "caption-input";

          const ratioSelect = document.createElement("select");
          ratioSelect.className = "rich-select";
          ratioSelect.title = "Formato de video";
          [
            { label: "16:9", val: "16 / 9" },
            { label: "4:3", val: "4 / 3" },
            { label: "9:16", val: "9 / 16" },
            { label: "1:1", val: "1 / 1" }
          ].forEach(rOpt => {
            const o = document.createElement("option");
            o.value = rOpt.val;
            o.textContent = rOpt.label;
            if ((block.aspectRatio || "16 / 9") === rOpt.val) o.selected = true;
            ratioSelect.appendChild(o);
          });
          ratioSelect.addEventListener("change", () => {
            block.aspectRatio = ratioSelect.value;
            videoWrap.style.aspectRatio = block.aspectRatio;
            saveToStorage();
          });
          rightCtrl.appendChild(ratioSelect);

          appendBorderControls(rightCtrl, block, () => {
            applyElementBorder(videoWrap, block);
          });

          rightCtrl.appendChild(dupBtn);

          const delBtn = document.createElement("button");
          delBtn.className = "mini-btn";
          delBtn.textContent = "x";
          delBtn.title = "Eliminar video";
          delBtn.addEventListener("click", () => {
            section.blocks.splice(index, 1);
            saveToStorage();
            renderBlocks();
          });
          rightCtrl.appendChild(delBtn);

          controls.appendChild(leftCtrl);
          controls.appendChild(rightCtrl);
          blockInner.appendChild(controls);

          const iframe = document.createElement("iframe");
          iframe.src = `https://www.youtube.com/embed/${block.videoId}`;
          iframe.title = "YouTube video";
          iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
          iframe.allowFullscreen = true;
          videoWrap.appendChild(iframe);
          blockInner.appendChild(videoWrap);

          if (block.caption && block.caption.trim() !== "") {
            const cap = document.createElement("div");
            cap.className = "image-caption";
            cap.textContent = block.caption;
            blockInner.appendChild(cap);
          }

          const capInput = document.createElement("input");
          capInput.type = "text";
          capInput.className = "caption-input";
          capInput.placeholder = "Epígrafe o ficha del video (opcional)...";
          capInput.value = block.caption || "";
          capInput.addEventListener("input", () => {
            block.caption = capInput.value;
            saveToStorage();
          });
          blockInner.appendChild(capInput);

        } else if (block.type === "grid") {
          const gridContainer = document.createElement("div");
          gridContainer.className = "grid-block-masonry";
          const activeCols = previewDevice === "mobile" ? (block.mobileCols || 2) : (block.cols || 3);
          gridContainer.style.columnCount = activeCols;

          colSelect.className = "rich-select";
          colSelect.title = previewDevice === "mobile" ? "Columnas en celular" : "Columnas en computadora";
          const colChoices = previewDevice === "mobile" ? [1, 2, 3] : [2, 3, 4, 5];
          colChoices.forEach(cNum => {
            const o = document.createElement("option");
            o.value = cNum;
            o.textContent = cNum + (previewDevice === "mobile" ? " cols celu" : " cols");
            if (activeCols === cNum) o.selected = true;
            colSelect.appendChild(o);
          });
          colSelect.addEventListener("change", () => {
            const val = parseInt(colSelect.value, 10);
            if (previewDevice === "mobile") {
              block.mobileCols = val;
            } else {
              block.cols = val;
            }
            gridContainer.style.columnCount = val;
            saveToStorage();
          });
          rightCtrl.appendChild(colSelect);

          appendBorderControls(rightCtrl, block, () => {
            gridContainer.querySelectorAll("img").forEach(im => applyElementBorder(im, block));
          });

          rightCtrl.appendChild(dupBtn);

          const delBtn = document.createElement("button");
          delBtn.className = "mini-btn";
          delBtn.textContent = "x";
          delBtn.title = "Eliminar grilla completa";
          delBtn.addEventListener("click", () => {
            section.blocks.splice(index, 1);
            saveToStorage();
            renderBlocks();
          });
          rightCtrl.appendChild(delBtn);

          controls.appendChild(leftCtrl);
          controls.appendChild(rightCtrl);
          blockInner.appendChild(controls);

          (block.images || []).forEach((src, imgIdx) => {
            const subItem = document.createElement("div");
            subItem.className = "grid-sub-item";

            const img = document.createElement("img");
            img.src = src;
            img.loading = "lazy";
            applyElementBorder(img, block);
            img.onerror = function() {
              this.onerror = null;
              this.src = getFallbackDriveUrl(src);
            };
            img.addEventListener("click", () => {
              openLightbox(block.images, imgIdx, "");
            });
            subItem.appendChild(img);

            const subCtrl = document.createElement("div");
            subCtrl.className = "grid-sub-controls";

            if (imgIdx > 0) {
              const prevBtn = document.createElement("button");
              prevBtn.className = "mini-btn";
              prevBtn.textContent = "←";
              prevBtn.title = "Mover antes";
              prevBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                const tmp = block.images[imgIdx - 1];
                block.images[imgIdx - 1] = block.images[imgIdx];
                block.images[imgIdx] = tmp;
                saveToStorage();
                renderBlocks();
              });
              subCtrl.appendChild(prevBtn);
            }

            if (imgIdx < block.images.length - 1) {
              const nextBtn = document.createElement("button");
              nextBtn.className = "mini-btn";
              nextBtn.textContent = "→";
              nextBtn.title = "Mover después";
              nextBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                const tmp = block.images[imgIdx + 1];
                block.images[imgIdx + 1] = block.images[imgIdx];
                block.images[imgIdx] = tmp;
                saveToStorage();
                renderBlocks();
              });
              subCtrl.appendChild(nextBtn);
            }

            const subCoverBtn = document.createElement("button");
            subCoverBtn.className = "mini-btn" + (section.featuredImg === src ? " selected" : "");
            subCoverBtn.textContent = "portada";
            subCoverBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              section.featuredImg = src;
              saveToStorage();
              renderBlocks();
            });
            subCtrl.appendChild(subCoverBtn);

            const subDelBtn = document.createElement("button");
            subDelBtn.className = "mini-btn";
            subDelBtn.textContent = "x";
            subDelBtn.title = "Quitar foto de la grilla";
            subDelBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              block.images.splice(imgIdx, 1);
              saveToStorage();
              renderBlocks();
            });
            subCtrl.appendChild(subDelBtn);

            subItem.appendChild(subCtrl);
            gridContainer.appendChild(subItem);
          });

          blockInner.appendChild(gridContainer);

          const addMoreBar = document.createElement("div");
          addMoreBar.className = "grid-add-more-bar";
          const moreInput = document.createElement("input");
          moreInput.type = "text";
          moreInput.placeholder = "Pegar más links de Drive para sumar a esta grilla...";
          const moreBtn = document.createElement("button");
          moreBtn.className = "mini-btn";
          moreBtn.textContent = "+ sumar a grilla";
          moreBtn.addEventListener("click", () => {
            const extraUrls = extractDriveUrls(moreInput.value);
            if (extraUrls.length > 0) {
              block.images.push(...extraUrls);
              saveToStorage();
              renderBlocks();
            }
          });
          addMoreBar.appendChild(moreInput);
          addMoreBar.appendChild(moreBtn);
          blockInner.appendChild(addMoreBar);
        }

        // Tirador libre en esquina inferior derecha
        const resizeHandle = document.createElement("div");
        resizeHandle.className = "free-resize-handle";
        resizeHandle.textContent = "◢";
        resizeHandle.title = "Arrastrar para variar tamaño libremente";
        resizeHandle.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const containerWidth = blocksContainerEl.clientWidth || 600;
          const startX = e.clientX;
          const startWidthPercent = getActiveWidth(block);

          function onResizeMove(ev) {
            const deltaPx = ev.clientX - startX;
            const deltaPercent = (deltaPx / containerWidth) * 100;
            const newWidth = Math.min(100, Math.max(20, Math.round(startWidthPercent + deltaPercent)));
            if (previewDevice === "mobile") {
              block.mobileWidth = newWidth;
            } else {
              block.width = newWidth;
            }
            slider.value = newWidth;
            widthLabel.textContent = newWidth + "%";
            applyBlockGeometry(blockEl, blockInner, block);
          }

          function onResizeUp() {
            window.removeEventListener("pointermove", onResizeMove);
            window.removeEventListener("pointerup", onResizeUp);
            saveToStorage();
          }

          window.addEventListener("pointermove", onResizeMove);
          window.addEventListener("pointerup", onResizeUp);
        });

        blockInner.appendChild(resizeHandle);
        enableStickerDrag(blockInner);

        blockEl.appendChild(blockInner);
        blocksContainerEl.appendChild(blockEl);
      });
    }

    .site-title { font-size: 14px; font-weight: normal; cursor: pointer; display: inline-block; margin-bottom: 14px; padding: 2px 4px; }
    .category-item { cursor: pointer; padding: 2px 4px; user-select: none; }
    .site-title:hover, .category-item:hover { color: var(--accent-color); }
    .category-item.active {
      color: #111111;
      background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
      background-size: 400% 100%;
      animation: flujoArcoiris 14s linear infinite;
    }
    .featured-box { width: 100%; margin-bottom: 16px; }
    .featured-box img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; border: 1px dashed var(--border-color); background: #f9f9f9; }
    .category-list { list-style: none; }
   
    .main { width: 66.6667%; padding: 20px; position: relative; min-height: 100vh; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px dashed var(--border-color); }
    .blocks-container { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; position: relative; min-height: 75vh; }
    .block-item { position: relative; max-width: 100%; }
    .align-left { flex-basis: 100%; display: flex; justify-content: flex-start; }
    .align-center { flex-basis: 100%; display: flex; justify-content: center; }
    .align-right { flex-basis: 100%; display: flex; justify-content: flex-end; }
    .block-inner { width: 100%; position: relative; }
    .block-item.align-sticker { position: absolute; z-index: 10; margin: 0; }
    .text-block-content { padding: 12px; line-height: 1.55; word-break: break-word; }
    .text-block-content h1 { font-size: 20px; font-weight: bold; margin-bottom: 8px; line-height: 1.25; }
    .text-block-content h2 { font-size: 15px; font-weight: bold; margin-bottom: 6px; }
    .text-block-content h3 { font-size: 12px; font-weight: normal; margin-bottom: 6px; letter-spacing: 0.2px; }
    .text-block-content p { margin-bottom: 8px; }
    .text-block-content ul, .text-block-content ol { padding-left: 20px; margin-bottom: 8px; }
    .text-block-content blockquote { border-left: 1px dashed var(--border-color); padding-left: 10px; margin: 8px 0; font-style: italic; }
    .text-block-content a { color: var(--accent-color); text-decoration: underline; }
    .spacer-block-inner { width: 100%; display: flex; align-items: center; justify-content: center; }
    .spacer-line { width: 100%; height: 0; }
    .image-block-figure img { width: 100%; height: auto; display: block; cursor: zoom-in; }
    .video-block-wrapper { width: 100%; position: relative; background: #000000; overflow: hidden; }
    .video-block-wrapper iframe { width: 100%; height: 100%; display: block; border: 0; }
    .image-caption { font-size: 11px; margin-top: 5px; opacity: 0.85; line-height: 1.35; }
    .grid-block-masonry { column-gap: 12px; width: 100%; }
    .grid-sub-item { break-inside: avoid; margin-bottom: 12px; }
    .grid-sub-item img { width: 100%; height: auto; display: block; cursor: zoom-in; }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(255, 255, 255, 0.96); z-index: 100; align-items: center; justify-content: center; flex-direction: column; padding: 24px; user-select: none; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 82vw; max-height: 82vh; width: auto; height: auto; border: 1px dashed var(--border-color); }
    .lightbox-caption { margin-top: 10px; font-size: 12px; max-width: 80vw; text-align: center; }
    .lightbox-counter { position: fixed; top: 16px; left: 20px; background: var(--bg-color); border: 1px dashed var(--border-color); padding: 4px 8px; font-size: 12px; display: none; }
    .lightbox-close { position: fixed; top: 16px; right: 20px; background: var(--bg-color); border: 1px dashed var(--border-color); padding: 4px 8px; cursor: pointer; font-size: 12px; }
    .lightbox-nav { position: fixed; top: 50%; transform: translateY(-50%); background: var(--bg-color); border: 1px dashed var(--border-color); padding: 8px 12px; cursor: pointer; font-size: 14px; color: var(--text-color); z-index: 102; display: none; }
    .lightbox-prev { left: 16px; }
    .lightbox-next { right: 16px; }
    .lightbox-close:hover, .lightbox-nav:hover { color: var(--accent-color); border-color: var(--accent-color); }
    @media (max-width: 900px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; position: static; height: auto; border-right: none; border-bottom: 1px dashed var(--border-color); }
      .main { width: 100%; }
      .blocks-container { gap: 10px; }
      .block-item.mobile-hidden { display: none !important; }
      .block-item.align-sticker { position: relative !important; left: auto !important; top: auto !important; flex-basis: 100%; display: flex; justify-content: center; width: 100% !important; }
      .block-item.align-sticker .block-inner { width: var(--mob-w, 100%) !important; }
      .block-item.align-flow { width: var(--mob-flow-w, 100%) !important; }
      .block-item:not(.align-flow):not(.align-sticker) .block-inner { width: var(--mob-w, 100%) !important; }
      .grid-block-masonry { column-count: var(--mob-cols, 2) !important; }
      .lightbox img { max-width: 92vw; max-height: 75vh; }
      .lightbox-nav { top: auto; bottom: 20px; transform: none; padding: 6px 14px; }
      .lightbox-prev { left: 25%; }
      .lightbox-next { right: 25%; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="site-title active" id="homeBtn">nikiri akerman</div>
      <div class="featured-box"><img id="featuredImg" src="" alt="Vista previa"></div>
      <ul class="category-list" id="categoryList"></ul>
    </aside>
    <main class="main">
      <div class="toolbar"><span id="currentViewLabel">inicio</span></div>
      <div class="blocks-container" id="blocksContainer"></div>
    </main>
  </div>
  <div class="lightbox" id="lightbox">
    <span class="lightbox-counter" id="lightboxCounter"></span>
    <button class="lightbox-close" id="lightboxClose">cerrar [esc]</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev">←</button>
    <img id="lightboxImg" src="" alt="">
    <button class="lightbox-nav lightbox-next" id="lightboxNext">→</button>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>
  <script>
    const DATA = ${publicDataJson};
    let activeSectionId = "home";
    let lbGallery = [];
    let lbIndex = 0;
    let touchStartX = 0;

    const categoryListEl = document.getElementById("categoryList");
    const blocksContainerEl = document.getElementById("blocksContainer");
    const featuredImgEl = document.getElementById("featuredImg");
    const currentViewLabelEl = document.getElementById("currentViewLabel");
    const homeBtn = document.getElementById("homeBtn");
    const lightboxEl = document.getElementById("lightbox");
    const lightboxImgEl = document.getElementById("lightboxImg");
    const lightboxCaptionEl = document.getElementById("lightboxCaption");
    const lightboxCounterEl = document.getElementById("lightboxCounter");
    const lightboxPrevEl = document.getElementById("lightboxPrev");
    const lightboxNextEl = document.getElementById("lightboxNext");

    function getFallbackDriveUrl(url) {
      const m = url.match(/\\/d\\/([a-zA-Z0-9_-]+)/);
      return m ? "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1600" : url;
    }
    function openLb(imgs, idx, cap) {
      lbGallery = imgs;
      lbIndex = idx;
      updateLb(cap);
      lightboxEl.classList.add("open");
    }
    function updateLb(cap) {
      const src = lbGallery[lbIndex];
      lightboxImgEl.onerror = function() { this.onerror = null; this.src = getFallbackDriveUrl(src); };
      lightboxImgEl.src = src;
      lightboxCaptionEl.textContent = cap || "";
      if (lbGallery.length > 1) {
        lightboxPrevEl.style.display = "block";
        lightboxNextEl.style.display = "block";
        lightboxCounterEl.style.display = "block";
        lightboxCounterEl.textContent = (lbIndex + 1) + " / " + lbGallery.length;
      } else {
        lightboxPrevEl.style.display = "none";
        lightboxNextEl.style.display = "none";
        lightboxCounterEl.style.display = "none";
      }
    }
    function stepLb(d) {
      if (lbGallery.length <= 1) return;
      lbIndex = (lbIndex + d + lbGallery.length) % lbGallery.length;
      updateLb("");
    }
    lightboxPrevEl.addEventListener("click", e => { e.stopPropagation(); stepLb(-1); });
    lightboxNextEl.addEventListener("click", e => { e.stopPropagation(); stepLb(1); });
    lightboxEl.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    lightboxEl.addEventListener("touchend", e => {
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 40) stepLb(diff > 0 ? 1 : -1);
    }, { passive: true });

    function getSectionPreviewImage(sec) {
      if (sec.featuredImg) return sec.featuredImg;
      const imgB = sec.blocks.find(b => b.type === "image" && b.src);
      if (imgB) return imgB.src;
      const gridB = sec.blocks.find(b => b.type === "grid" && b.images && b.images.length);
      if (gridB) return gridB.images[0];
      const vidB = sec.blocks.find(b => b.type === "youtube" && b.videoId);
      if (vidB) return "https://img.youtube.com/vi/" + vidB.videoId + "/hqdefault.jpg";
      return DATA.home.featuredImg || "";
    }
    function setFeatured(src) {
      if (!src) return;
      featuredImgEl.onerror = function() { this.onerror = null; this.src = getFallbackDriveUrl(src); };
      featuredImgEl.src = src;
    }
    function applyBorder(el, b) {
      const st = b.borderStyle !== undefined ? b.borderStyle : "dashed";
      el.style.border = st === "none" ? "none" : (b.borderWidth || 1) + "px " + st + " " + (b.borderColor || "#111111");
      el.style.borderRadius = b.borderRadius || "0px";
    }
    function render() {
      categoryListEl.innerHTML = "";
      DATA.categories.forEach(cat => {
        const li = document.createElement("li");
        li.className = "category-item" + (activeSectionId === cat.id ? " active" : "");
        li.textContent = cat.name;
        li.addEventListener("mouseenter", () => setFeatured(getSectionPreviewImage(cat)));
        li.addEventListener("click", () => { activeSectionId = cat.id; render(); });
        categoryListEl.appendChild(li);
      });
      homeBtn.className = "site-title" + (activeSectionId === "home" ? " active" : "");
      const sec = activeSectionId === "home" ? DATA.home : DATA.categories.find(c => c.id === activeSectionId);
      if (!sec) return;
      currentViewLabelEl.textContent = sec.name;
      setFeatured(getSectionPreviewImage(sec));
      blocksContainerEl.innerHTML = "";
      sec.blocks.forEach(b => {
        const w = b.width || 100;
        const mw = b.mobileWidth !== undefined ? b.mobileWidth : 100;
        const align = b.align || "flow";
        const bEl = document.createElement("div");
        bEl.className = "block-item align-" + align + (b.hideMobile ? " mobile-hidden" : "");
        bEl.style.setProperty("--mob-w", mw + "%");
        bEl.style.setProperty("--mob-flow-w", mw >= 98 ? "100%" : "calc(" + mw + "% - 6px)");

        const bIn = document.createElement("div");
        bIn.className = "block-inner";
        if (align === "sticker") {
          bEl.style.width = w + "%";
          bEl.style.left = (b.x || 40) + "px";
          bEl.style.top = (b.y || 40) + "px";
        } else if (align === "flow") {
          bEl.style.width = w >= 98 ? "100%" : "calc(" + w + "% - 8px)";
        } else {
          bIn.style.width = w + "%";
        }
        if (b.type === "text") {
          const d = document.createElement("div");
          d.className = "text-block-content";
          d.innerHTML = b.html || "";
          applyBorder(d, b);
          bIn.appendChild(d);
        } else if (b.type === "spacer") {
          const sp = document.createElement("div");
          sp.className = "spacer-block-inner";
          sp.style.height = (b.height || 30) + "px";
          const ln = document.createElement("div");
          ln.className = "spacer-line";
          const st = b.borderStyle !== undefined ? b.borderStyle : "dashed";
          ln.style.borderTop = st === "none" ? "none" : (b.borderWidth || 1) + "px " + st + " " + (b.borderColor || "#111111");
          sp.appendChild(ln);
          bIn.appendChild(sp);
        } else if (b.type === "image") {
          const fig = document.createElement("div");
          fig.className = "image-block-figure";
          const img = document.createElement("img");
          img.src = b.src;
          img.loading = "lazy";
          applyBorder(img, b);
          img.onerror = function() { this.onerror = null; this.src = getFallbackDriveUrl(b.src); };
          img.addEventListener("click", () => openLb([b.src], 0, b.caption || ""));
          fig.appendChild(img);
          if (b.caption) {
            const c = document.createElement("div");
            c.className = "image-caption";
            c.textContent = b.caption;
            fig.appendChild(c);
          }
          bIn.appendChild(fig);
        } else if (b.type === "youtube") {
          const vw = document.createElement("div");
          vw.className = "video-block-wrapper";
          vw.style.aspectRatio = b.aspectRatio || "16 / 9";
          applyBorder(vw, b);
          const ifr = document.createElement("iframe");
          ifr.src = "https://www.youtube.com/embed/" + b.videoId;
          ifr.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
          ifr.allowFullscreen = true;
          vw.appendChild(ifr);
          bIn.appendChild(vw);
          if (b.caption) {
            const c = document.createElement("div");
            c.className = "image-caption";
            c.textContent = b.caption;
            bIn.appendChild(c);
          }
        } else if (b.type === "grid") {
          const gc = document.createElement("div");
          gc.className = "grid-block-masonry";
          gc.style.columnCount = b.cols || 3;
          gc.style.setProperty("--mob-cols", b.mobileCols || 2);
          (b.images || []).forEach((src, i) => {
            const sub = document.createElement("div");
            sub.className = "grid-sub-item";
            const img = document.createElement("img");
            img.src = src;
            img.loading = "lazy";
            applyBorder(img, b);
            img.onerror = function() { this.onerror = null; this.src = getFallbackDriveUrl(src); };
            img.addEventListener("click", () => openLb(b.images, i, ""));
            sub.appendChild(img);
            gc.appendChild(sub);
          });
          bIn.appendChild(gc);
        }
        bEl.appendChild(bIn);
        blocksContainerEl.appendChild(bEl);
      });
    }
    homeBtn.addEventListener("mouseenter", () => setFeatured(getSectionPreviewImage(DATA.home)));
    homeBtn.addEventListener("click", () => { activeSectionId = "home"; render(); });
    document.getElementById("lightboxClose").addEventListener("click", () => lightboxEl.classList.remove("open"));
    lightboxEl.addEventListener("click", e => { if (e.target === lightboxEl) lightboxEl.classList.remove("open"); });
    document.addEventListener("keydown", e => {
      if (!lightboxEl.classList.contains("open")) return;
      if (e.key === "Escape") lightboxEl.classList.remove("open");
      if (e.key === "ArrowLeft") stepLb(-1);
      if (e.key === "ArrowRight") stepLb(1);
    });
    render();
  <\/script>
</body>
</html>`;

      const blob = new Blob([publicHtml], { type: "text/html;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "index.html";
      a.click();
    });

    lightboxCloseEl.addEventListener("click", () => lightboxEl.classList.remove("open"));
    lightboxEl.addEventListener("click", (e) => {
      if (e.target === lightboxEl) lightboxEl.classList.remove("open");
    });
    document.addEventListener("keydown", (e) => {
      if (!lightboxEl.classList.contains("open")) return;
      if (e.key === "Escape") lightboxEl.classList.remove("open");
      if (e.key === "ArrowLeft") stepLightbox(-1);
      if (e.key === "ArrowRight") stepLightbox(1);
    });

    updateView();
  </script>
</body>
</html>
